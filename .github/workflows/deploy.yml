name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  # Plan row 30: without this, no feature branch is ever checked — CI only ran on
  # main/master, so nothing on a working branch produced evidence of anything.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Not sized to the measured ~53s of steps: that would fail a slow runner. Headroom for
    # a normal run, a hard stop for a hung QuickJS/Playwright one.
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Markdown Schema & Code Blocks
        run: npm run validate

      - name: Run Executable Test Suite
        run: npm test

      - name: Run Judge Subsystem Tests
        run: npm run test:judge

      - name: Run Chat Backend Unit Tests
        run: npm run test:chat

      - name: Build Web Portal Data Bundle
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Chat Widget E2E Tests
        run: npx playwright test

      - name: Setup Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name == 'push'
        uses: actions/deploy-pages@v4
