name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  # Plan row 30: without this, no feature branch is ever checked — CI only ran on
  # main/master, so nothing on a working branch produced evidence of anything.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Headroom for a normal run, a hard stop for a hung QuickJS or Playwright one. NOT sized to
    # the measured step total: at 15 this job was cancelled at 916 s, with the e2e step cut off
    # and the Pages deploy skipped, because the workflow outgrew the bound it was given. The old
    # note here claimed ~250 s of steps; that counted neither `npm ci`, nor `playwright install`,
    # nor `npm run build`, nor the two tool installs. Measure the JOB, not the steps you can see.
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # test-trace picks its diff renderer by looking for `delta` on PATH. A runner has none, so
      # the renderer fell back to plain text and four assertions failed with `renderer was "text"`
      # — on S5b and S9, the plan §0.2 claim itself. Same shape as the ast-grep dependency: a tool
      # the suite requires that nothing declared. The no-delta fallback assertions hide `delta`
      # from PATH themselves, so installing it here cannot make them pass vacuously.
      - name: Install delta (the trace differ)
        run: |
          cargo install --locked delta || {
            echo "cargo unavailable; falling back to the release binary"
            curl -fsSL https://github.com/dandavison/delta/releases/download/0.18.2/delta-0.18.2-x86_64-unknown-linux-gnu.tar.gz \
              | tar -xz -C /usr/local/bin --strip-components=1
          }
          delta --version

      - name: Validate Markdown Schema & Code Blocks
        run: npm run validate

      - name: Run Executable Test Suite
        run: npm test

      - name: Run Judge Subsystem Tests
        run: npm run test:judge

      - name: Run Chat Backend Unit Tests
        run: npm run test:chat

      - name: Audit Curriculum Counts
        run: npm run audit:check

      - name: Generate Golden Traces
        run: npm run gen:traces

      - name: Golden Differ, Envelope Freeze & Trace Gates
        run: npm run test:trace

      # 190 s measured — the most expensive step by an order of magnitude, because every case
      # boots a QuickJS sandbox. Kept as its own step so the cost is attributable in the log
      # rather than hidden inside a chain, and so a slow runner shows which step paid for it.
      - name: 'Trace Runner (sandbox: chunking, budget, caps, verdict isolation)'
        run: npm run test:trace-runner

      - name: Build Web Portal Data Bundle
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Chat Widget E2E Tests
        run: npx playwright test

      - name: Setup Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name == 'push'
        uses: actions/deploy-pages@v4
