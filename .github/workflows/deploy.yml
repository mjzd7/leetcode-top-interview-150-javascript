name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  # Plan row 30: without this, no feature branch is ever checked — CI only ran on
  # main/master, so nothing on a working branch produced evidence of anything.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Measured step total is now ~250 s (validate 1.4 · test 15.6 · judge 4.0 · chat 14.8 ·
    # trace 3.0 · trace-runner 190 · the rest <3), plus `npm ci`, `playwright install` and
    # `npm run build`. NOT sized to that sum — it would fail a slow runner. Headroom for a
    # normal run, a hard stop for a hung QuickJS or Playwright one.
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Markdown Schema & Code Blocks
        run: npm run validate

      - name: Run Executable Test Suite
        run: npm test

      - name: Run Judge Subsystem Tests
        run: npm run test:judge

      - name: Run Chat Backend Unit Tests
        run: npm run test:chat

      - name: Audit Curriculum Counts
        run: npm run audit:check

      - name: Generate Golden Traces
        run: npm run gen:traces

      - name: Golden Differ, Envelope Freeze & Trace Gates
        run: npm run test:trace

      # 190 s measured — the most expensive step by an order of magnitude, because every case
      # boots a QuickJS sandbox. Kept as its own step so the cost is attributable in the log
      # rather than hidden inside a chain, and so a slow runner shows which step paid for it.
      - name: 'Trace Runner (sandbox: chunking, budget, caps, verdict isolation)'
        run: npm run test:trace-runner

      - name: Build Web Portal Data Bundle
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Chat Widget E2E Tests
        run: npx playwright test

      - name: Setup Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name == 'push'
        uses: actions/deploy-pages@v4
