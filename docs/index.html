    /* Codeboxes carry their own rhythm (same 1.4rem as tables/diagrams) so gaps
       never depend on the neighbour; the inner pre margin from the Prism theme
       is neutralised so it can't leak through the wrap. */
    .prose .code-wrap { margin: 1.4rem 0; }
    .prose .code-wrap > pre { margin-top: 0; margin-bottom: 0; }

    .prose li { margin-bottom: 0.35rem; }
    .prose li::marker { color: var(--accent); }
    .prose code:not(pre code) {
      background: rgba(200, 250, 75, 0.09); color: var(--accent);
      padding: 0.15rem 0.42rem; border-radius: 0.375rem;
      font-size: 0.85em; font-family: "JetBrains Mono", monospace; white-space: normal;
      overflow-wrap: anywhere; word-break: break-word;
    }
    .prose code.primer-path { background: rgba(139,148,167,.12); color: #AEB8CC; cursor: help; }
    .prose code.primer-link { cursor: pointer; }
    .prose code.primer-link:hover { background: rgba(200,250,75,.18); }
    .prose a > code { text-decoration: underline; text-underline-offset: 3px; }
    /* Long unbreakable runs (bare URLs in Sources lists, slash-joined codes
       like (200/201/…) in Q&A) must wrap — otherwise they force the flex
       article wider than the viewport and show blank space on mobile. */
    .prose p, .prose a, .prose li { overflow-wrap: anywhere; }
    .katex { font-size: 1.02em; position: relative; }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.4rem 0; }
    .prose blockquote { border-left: 3px solid var(--accent); padding-left: 1rem; color: var(--muted); margin: 1rem 0; }
    .mermaid {
      background: #0A0D13; border: 1px solid var(--line); border-radius: 0.75rem;

    .nav-item { transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease; }

    #sidebar { transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1); }
    #palette { transition: opacity 0.15s ease; }

    .pal-item[aria-selected="true"] { background: rgba(200, 250, 75, 0.1); }
    .copy-btn { opacity: 0; transition: opacity 0.15s ease, background-color 0.15s ease; }
    .code-wrap:hover .copy-btn, .copy-btn:focus-visible { opacity: 1; }
    /* Touch views: no dedicated button (it overlaps code) — double-tap the box to copy instead. */
    .code-wrap { touch-action: manipulation; }
    @media (hover: none) {
      .copy-btn { display: none; }
      /* Touch browsers: hide all scrollbars (code/table/panel) — touch scroll
         still works. The reading-progress hairline at the very top stays. */
      * { scrollbar-width: none; -ms-overflow-style: none; }

    .toc-link.active { color: var(--accent); border-color: var(--accent); }
    kbd.k {

    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    }
  </style>

  <script src="curriculum-data.js"></script>

  <script>
    'use strict';
    /* ---------- data index ---------- */
    const DATA = (window.CURRICULUM_DATA || []).filter(c => c && Array.isArray(c.items));
    const byId = new Map();
    const flatOrder = [];
    DATA.forEach(cat => cat.items.forEach(item => {
      byId.set(item.id, { item, category: cat.category });
      if (cat.category !== 'FOUNDATIONS') flatOrder.push(item.id);
    }));

    /* ---------- persistent progress ---------- */
    const LS_KEY = 'lt150-done-v1';
    let doneSet = new Set();
    try { doneSet = new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]')); } catch (e) { doneSet = new Set(); }
    const saveDone = () => { try { localStorage.setItem(LS_KEY, JSON.stringify([...doneSet])); } catch (e) {} };

    /* ---------- state ---------- */
    let activeFilter = 'ALL';
    let searchQuery = '';
    let currentItemId = null;
    let palIndex = 0;
    let palResults = [];

    /* ---------- element refs ---------- */
    const $ = (id) => document.getElementById(id);
    const nav = $('curriculumNav'), contentArea = $('articleContent'), articleHead = $('articleHead'),
      crumbRow = $('crumbRow'), prevNext = $('prevNext'), tocNav = $('tocNav'),
      searchInput = $('searchInput'), sidebar = $('sidebar'), sideOverlay = $('sideOverlay'),
      palette = $('palette'), paletteCard = $('paletteCard'), paletteInput = $('paletteInput'),
      paletteList = $('paletteList'), scroller = $('contentContainer'), progressBar = $('progressBar');

    const DIFF_STYLE = {
      Easy: 'background:rgba(52,211,153,.12);color:#34D399;border:1px solid rgba(52,211,153,.3)',
      Medium: 'background:rgba(251,191,36,.12);color:#FBBF24;border:1px solid rgba(251,191,36,.3)',
      Hard: 'background:rgba(251,113,133,.12);color:#FB7185;border:1px solid rgba(251,113,133,.3)',
      Primer: 'background:rgba(200,250,75,.1);color:#C8FA4B;border:1px solid rgba(200,250,75,.3)',
    };
    const badge = (d) => `<span class="text-[10px] px-1.5 py-0.5 rounded font-semibold shrink-0 font-mono" style="${DIFF_STYLE[d] || DIFF_STYLE.Primer}">${d}</span>`;
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    /* ---------- sidebar ---------- */
    function paintFilterPills() {
      document.querySelectorAll('.filter-btn').forEach(b => {
        const on = b.dataset.diff === activeFilter;
        b.style.cssText = on
          ? 'background:#C8FA4B;color:#101303;'
          : 'background:rgba(255,255,255,.04);color:#8B94A7;';
      });
    }

    function renderProgress() {
      const total = flatOrder.length || 1;
      const done = flatOrder.filter(id => doneSet.has(id)).length;
      const pct = Math.round((done / total) * 100);
      $('ringFg').style.strokeDashoffset = String(163.36 * (1 - done / total));
      $('ringPct').textContent = pct + '%';
      $('ringSub').textContent = done + ' / ' + flatOrder.length + ' done';
      $('overallChip').innerHTML = '<span class="inline-block h-1.5 w-1.5 rounded-full" style="background:#C8FA4B"></span>' + pct + '% complete';
    }

    function renderNav() {
      nav.innerHTML = '';
      if (!DATA.length) {
        nav.innerHTML = '<p class="text-sm text-slate-500 px-2">No curriculum data found. Run <span class="font-mono">npm run build</span>.</p>';
        return;
      }
      DATA.forEach(cat => {
        const items = cat.items.filter(item => {
          const diffOk = activeFilter === 'ALL' ? true : item.difficulty === activeFilter;
          if (!diffOk) return false;
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          return item.title.toLowerCase().includes(q) || item.content.toLowerCase().includes(q);
        });
        if (!items.length) return;
        const isFound = cat.category === 'FOUNDATIONS';
        const doneCount = isFound ? 0 : items.filter(i => doneSet.has(i.id)).length;
        const wrap = document.createElement('div');
        const head = document.createElement('div');
        head.className = 'px-2 pt-1';
        head.innerHTML = '<div class="flex items-baseline justify-between gap-2">' +
          '<span class="text-[11px] font-bold text-slate-400 uppercase tracking-widest font-display">' + esc(cat.category) + '</span>' +
          (isFound
            ? '<span class="text-[10px] font-mono text-slate-600">' + items.length + '</span>'
            : '<span class="text-[10px] font-mono text-slate-500">' + doneCount + '/' + items.length + '</span>') +
          '</div>' +
          (isFound ? '' : '<div class="mod-bar mt-1.5"><span style="width:' + Math.round((doneCount / items.length) * 100) + '%"></span></div>');
        wrap.appendChild(head);
        const list = document.createElement('div');
        list.className = 'space-y-0.5 mt-1';
        items.forEach(item => {
          const done = doneSet.has(item.id);
          const active = item.id === currentItemId;
          const btn = document.createElement('button');
          btn.className = 'nav-item w-full text-left px-3 py-2.5 rounded-lg text-[13px] flex items-center gap-2 border min-h-[44px] md:min-h-0';
          btn.style.cssText = active
            ? 'background:rgba(200,250,75,.1);color:#fff;border-color:rgba(200,250,75,.35);'
            : 'color:#C2C9D8;border-color:transparent;';
          btn.onmouseenter = () => { if (!active) btn.style.background = 'rgba(255,255,255,.05)'; };
          btn.onmouseleave = () => { if (!active) btn.style.background = 'transparent'; };
          btn.innerHTML =
            '<span class="shrink-0 w-4 text-center font-mono text-[11px]" style="color:' + (done ? '#C8FA4B' : '#3A4358') + '">' + (done ? '✓' : '·') + '</span>' +

    function enhanceCodeBlocks() {
      // Wrap tables for safe mobile horizontal scroll (global fix)
      contentArea.querySelectorAll('table').forEach(tbl => {
        if (tbl.parentElement && tbl.parentElement.classList.contains('table-scroll')) return;
        const wrap = document.createElement('div');
        wrap.className = 'table-scroll';
        tbl.replaceWith(wrap);
        wrap.appendChild(tbl);
      });
      // Tag raw primer file-paths so they show a tooltip instead of looking broken
      // Linkify: bare http(s) code pills (e.g. LeetCode Link) open in a new tab;
      // primer file-paths open the primer inside the portal when it exists.
      contentArea.querySelectorAll('code').forEach(c => {
        if (c.closest('pre')) return;
        const t = c.textContent.trim();
        if (/^https?:\/\//.test(t)) {
          const a = document.createElement('a');
          a.href = t;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.title = 'Open in new tab: ' + t;
          c.replaceWith(a);
          a.appendChild(c);
          return;
        }
        if (/\.md$/.test(t)) {
          const id = t.replace(/\.md$/, '').replace(/\//g, '_');
          if (byId.has(id)) {
            c.classList.add('primer-link');
            c.title = 'Open primer in portal: ' + t;
            c.onclick = () => openArticle(id);
          } else {
            c.classList.add('primer-path');
            c.title = t;
          }
        }
      });
      contentArea.querySelectorAll('pre code').forEach(block => {
        if (block.classList.contains('language-mermaid')) {
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = block.textContent;
          block.parentElement.replaceWith(div);
          return;
        }
        const pre = block.parentElement;
        const wrap = document.createElement('div');
        wrap.className = 'code-wrap relative';
        pre.replaceWith(wrap);
        wrap.appendChild(pre);
        const btn = document.createElement('button');
        btn.className = 'copy-btn absolute top-2 right-2 text-[11px] font-mono px-2.5 py-1.5 rounded-md bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300';
        btn.textContent = 'Copy';
        btn.onclick = async () => {
          const ok = await copyText(block.textContent);
          btn.textContent = ok ? 'Copied ✓' : 'Copy failed';
          setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
        };
        wrap.appendChild(btn);
        // Touch views: double-tap the code box to copy (no button there).
        let lastTap = 0, lastX = 0, lastY = 0, multiTouch = false;
        wrap.addEventListener('touchstart', (e) => {
          if (e.touches.length > 1) multiTouch = true;
        }, { passive: true });
        wrap.addEventListener('touchend', async (e) => {
          if (e.touches.length > 0) return; // still touching (pinch/scroll)
          if (multiTouch) { multiTouch = false; lastTap = 0; return; }
          const t = e.changedTouches[0];
          const now = Date.now();
          const moved = Math.hypot(t.clientX - lastX, t.clientY - lastY);
          if (lastTap > 0 && now - lastTap < 350 && moved < 30) {
            lastTap = 0;
            flashCopied(wrap, await copyText(block.textContent));
          } else {
            lastTap = now; lastX = t.clientX; lastY = t.clientY;
          }
        }, { passive: true });
      });
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          ta.remove();
          return ok;
        } catch (e2) { return false; }
      }
    }

    // Transient "Copied ✓" pill for touch views (no persistent button to update).
    function flashCopied(wrap, ok) {
      wrap.querySelectorAll('.copy-flash').forEach(n => n.remove());
      const pill = document.createElement('span');
      pill.className = 'copy-flash absolute top-2 right-2 text-[11px] font-mono px-2.5 py-1.5 rounded-md bg-white/5 border border-white/10 text-slate-300';
      pill.textContent = ok ? 'Copied ✓' : 'Copy failed';
      wrap.appendChild(pill);
      setTimeout(() => pill.remove(), 1500);
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

          });
          await mermaid.run();
        } catch (e) {}
      }
      // Global math fix: render $...$ / $$...$$ outside pre/code (skips JS template literals)
      if (window.renderMathInElement) {
        try {
          renderMathInElement(contentArea, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ],
            ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
            throwOnError: false
          });

        const rows = (v.tests || []).map(t =>
          '<tr><td>' + esc(t.name || '') + '</td><td class="font-mono">' + (t.ok ? '<span style="color:#34D399">pass</span>' : '<span style="color:#FB7185">fail</span>') + '</td>' +
          '<td class="font-mono text-xs">' + esc(t.expected !== undefined ? JSON.stringify(t.expected) : '') + '</td>' +
          '<td class="font-mono text-xs">' + esc(t.got !== undefined ? JSON.stringify(t.got) : '') + '</td></tr>').join('');
        box.innerHTML =
          '<div class="table-scroll"><table><thead><tr><th>Test</th><th>Result</th><th>Expected</th><th>Got</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
          '<p class="mt-2 text-sm font-semibold ' + (v.failed === 0 && !v.error ? '' : 'text-slate-400') + '" ' + (v.failed === 0 && !v.error ? 'style="color:#C8FA4B"' : '') + '>' +
          esc(v.failed === 0 && !v.error ? 'All ' + v.passed + ' tests passed ✓' : v.passed + ' passed · ' + v.failed + ' failed') +
          (v.error ? ' · ' + esc(String(v.error)) : '') + (v.truncated ? ' · output truncated' : '') + '</p>';
      };
      $('judgeRun').onclick = async () => {
        if (!judgeUser) {
          $('judgeStatus').textContent = 'Login with GitHub first to run code.';
          return;
        }
        $('judgeRun').disabled = true;
        $('judgeStatus').textContent = 'Running…';
        paintVerdict(null);
        try {
          const r = await fetch('/api/judge/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ problemId: pilot.slug, code: ta.value }),
          });
          const v = await r.json();
          $('judgeStatus').textContent = '';
          paintVerdict(r.ok ? v : { error: (v && v.error) || ('HTTP ' + r.status) });
          if (r.ok && v && !v.error && v.failed === 0 && v.passed > 0) {
            doneSet.add(entry.item.id);
            saveDone();
            renderNav();
            renderHead(entry);
          }
        } catch (e) {
          $('judgeStatus').textContent = '';
          paintVerdict({ error: 'Judge API unreachable. Deploy with /api support to run code.' });
        }
        $('judgeRun').disabled = false;
      };
    }

    function checkLoginError() {
      try {
        const q = new URLSearchParams(location.search);
        const err = q.get('login_error');
        if (!err) return;
        q.delete('login_error');
        history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash);
        const bar = document.createElement('div');
        bar.className = 'mx-auto max-w-3xl mt-3 px-4 py-2.5 rounded-xl text-sm border';
        bar.style.cssText = 'border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.07);color:#E9EDF4;';
        bar.textContent = 'GitHub login failed (' + err + '). Please try again.';
        contentArea.prepend(bar);
      } catch (e) {}
    }

    /* ---------- sidebar open/close (mobile) ---------- */
    function openSidebar() {
      sidebar.classList.remove('-translate-x-full');
      sideOverlay.classList.remove('hidden');
    }
    function closeSidebar() {
      if (window.innerWidth >= 768) return;
      sidebar.classList.add('-translate-x-full');
      sideOverlay.classList.add('hidden');
    }
    $('menuBtn').onclick = openSidebar;
    sideOverlay.onclick = closeSidebar;
    $('brandHome').onclick = (e) => {
      e.preventDefault();
      openHome();
    };

    /* ---------- filters ---------- */
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => { activeFilter = btn.dataset.diff; paintFilterPills(); renderNav(); };
    });
    searchInput.oninput = (e) => { searchQuery = e.target.value; renderNav(); };

    /* ---------- command palette ---------- */
    function fuzzyMatch(hay, needle) {
      hay = hay.toLowerCase();
      needle = needle.toLowerCase().replace(/\s+/g, '');
      let hi = 0;
      for (const ch of needle) {
        hi = hay.indexOf(ch, hi);
        if (hi === -1) return false;
        hi++;
      }
      return true;
    }
    function openPalette() {
      palette.classList.remove('hidden');
      requestAnimationFrame(() => {
        palette.classList.remove('opacity-0');
        paletteCard.classList.remove('opacity-0', 'scale-[0.98]');
      });
      paletteInput.value = '';
      updatePalette('');
      setTimeout(() => paletteInput.focus(), 30);
    }
    function closePalette() {
      palette.classList.add('opacity-0');
      paletteCard.classList.add('opacity-0', 'scale-[0.98]');
      setTimeout(() => palette.classList.add('hidden'), 150);
      paletteInput.blur();
    }
    function updatePalette(q) {
      const query = q.trim();
      palResults = flatOrder
        .map(id => byId.get(id))
        .filter(e => !query || fuzzyMatch(e.item.title + ' ' + (e.item.pattern || '') + ' ' + e.category, query))
        .slice(0, 12);
      palIndex = 0;
      paletteList.innerHTML = palResults.length ? '' : '<p class="text-sm text-slate-500 px-3 py-6 text-center">No matches. Try a pattern name like “sliding window”.</p>';
      palResults.forEach((e, i) => {
        const done = doneSet.has(e.item.id);
        const div = document.createElement('div');
        div.className = 'pal-item flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer';
        div.setAttribute('role', 'option');
        div.setAttribute('aria-selected', i === palIndex ? 'true' : 'false');
        div.innerHTML =
          '<span class="font-mono text-[11px] w-4 text-center shrink-0" style="color:' + (done ? '#C8FA4B' : '#3A4358') + '">' + (done ? '✓' : '·') + '</span>' +
          '<span class="flex-1 min-w-0"><span class="block text-sm text-slate-200 truncate">' + esc(e.item.title) + '</span>' +
          '<span class="block text-[11px] text-slate-500 font-mono truncate">' + esc(e.category) + '</span></span>' +
          badge(e.item.difficulty);
        div.onclick = () => { closePalette(); openArticle(e.item.id); };
        div.onmousemove = () => { palIndex = i; paintPalSelection(); };
        paletteList.appendChild(div);
      });
    }
    function paintPalSelection() {
      paletteList.querySelectorAll('.pal-item').forEach((el, i) => el.setAttribute('aria-selected', i === palIndex ? 'true' : 'false'));
    }
    $('paletteBtn').onclick = openPalette;
    paletteInput.oninput = (e) => updatePalette(e.target.value);
    paletteInput.onkeydown = (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); palIndex = Math.min(palIndex + 1, palResults.length - 1); paintPalSelection(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); palIndex = Math.max(palIndex - 1, 0); paintPalSelection(); }
      else if (e.key === 'Enter' && palResults[palIndex]) { closePalette(); openArticle(palResults[palIndex].item.id); }
      else if (e.key === 'Escape') closePalette();
    };
    palette.addEventListener('click', (e) => { if (e.target === palette.firstElementChild || e.target === palette) closePalette(); });
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); palette.classList.contains('hidden') ? openPalette() : closePalette(); }
      else if (e.key === 'Escape') { if (!palette.classList.contains('hidden')) closePalette(); else closeSidebar(); }
    });

    /* ---------- reading progress ---------- */
    function updateProgressBar() {
      const max = scroller.scrollHeight - scroller.clientHeight;
      const pct = max > 0 ? (scroller.scrollTop / max) * 100 : 0;
      progressBar.style.width = pct + '%';
    }
    scroller.addEventListener('scroll', updateProgressBar, { passive: true });

    /* ---------- scroll-spy for TOC ---------- */
    const spy = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          tocNav.querySelectorAll('.toc-link').forEach(a => {
            a.classList.toggle('active', a.getAttribute('href') === '#' + en.target.id);
          });
        }
      });
    }, { root: scroller, rootMargin: '-20% 0px -70% 0px' });
    const origRenderTOC = renderTOC;
    renderTOC = function () {
      spy.disconnect();
      origRenderTOC();
      contentArea.querySelectorAll('h2[id]').forEach(h => spy.observe(h));
    };

    /* ---------- init ---------- */
    paintFilterPills();
    renderNav();
    refreshAuth();
    const startId = location.hash ? location.hash.slice(1) : null;
    if (startId && byId.has(startId)) openArticle(startId);
    else openHome();
    checkLoginError();
    updateProgressBar();
  </script>
</body>
</html>
