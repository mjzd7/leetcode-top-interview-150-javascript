        </div>
        <div id="paletteList" class="max-h-[50dvh] overflow-y-auto p-2" role="listbox"></div>
        <div class="px-4 py-2.5 border-t border-[rgba(148,163,184,0.13)] flex items-center gap-4 text-[11px] text-slate-500 font-mono">
          <span><kbd class="k">↑↓</kbd> navigate</span><span><kbd class="k">↵</kbd> open</span><span><kbd class="k">esc</kbd> close</span>
        </div>
      </div>
    </div>
  </div>

  <script src="curriculum-data.js"></script>

  <script>
    'use strict';
    /* ---------- data index ---------- */
    const DATA = (window.CURRICULUM_DATA || []).filter(c => c && Array.isArray(c.items));
    const byId = new Map();
    const flatOrder = [];
    const allOrder = [];
    DATA.forEach(cat => cat.items.forEach(item => {
      byId.set(item.id, { item, category: cat.category });
      allOrder.push(item.id);
      if (cat.category !== 'FOUNDATIONS') flatOrder.push(item.id);
    }));

    /* ---------- the 56px rail ---------- */
    /* One glyph per category, drawn to be told apart at 19px: a grid reads as a
       matrix, stacked bars as a stack, connected nodes as a linked list. Detail
       is the enemy here — silhouette does the identifying, and the tooltip
       carries the name. */
    const CAT_ICON = {
      'FOUNDATIONS': '<path d="M4 6.5h16M4 12h16M4 17.5h10"/>',
      'MAANG GUIDES': '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/><path d="M12 2v2.6M12 19.4V22M2 12h2.6M19.4 12H22"/>',
      'MODERN ENGINEER SKILLS': '<path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2z"/>',
      'FRESHER ROADMAP': '<path d="M6 21V4M6 4.5h11l-2.4 3.6L17 12H6"/>',
      'MID-LEVEL ROADMAP': '<path d="M3 20h5v-5h5v-5h5V5"/>',
      'ARRAY STRING': '<path d="M4 8h16M4 12h16M4 16h16"/>',
      'TWO POINTERS': '<path d="M4 12h13M13 8l4 4-4 4M20 5v14"/>',
      'SLIDING WINDOW': '<rect x="3" y="7" width="12" height="10" rx="1.6"/><path d="M17 12h4M19 10l2 2-2 2"/>',
      'MATRIX': '<rect x="4" y="4" width="16" height="16" rx="1.6"/><path d="M4 12h16M12 4v16"/>',
      'HASHMAP': '<rect x="3" y="9" width="8" height="6" rx="1.4"/><rect x="14" y="9" width="7" height="6" rx="1.4"/><path d="M11 12h3M6 6v3M18 6v3"/>',
      'INTERVALS': '<path d="M4 8h16M7 13h13M4 18h9"/>',
      'STACK': '<path d="M4 8h16M6 12h12M8 16h8"/><path d="M12 19v2.5M10 20l2 2 2-2"/>',
      'LINKED LIST': '<circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><path d="M7.2 12h2.6M14.2 12h2.6"/>',
      'BINARY TREE GENERAL': '<circle cx="12" cy="5" r="2.2"/><circle cx="5.5" cy="18" r="2.2"/><circle cx="18.5" cy="18" r="2.2"/><path d="M10.4 6.8 7 15.9M13.6 6.8 17 15.9"/>',
      'BINARY TREE BFS': '<circle cx="12" cy="5" r="2.1"/><circle cx="6" cy="12" r="2.1"/><circle cx="18" cy="12" r="2.1"/><path d="M12 7.1V10M6 14.1V18M18 14.1V18M3 18h6M15 18h6"/>',
      'BINARY SEARCH TREE': '<circle cx="12" cy="5" r="2.1"/><circle cx="6" cy="13" r="2.1"/><circle cx="18" cy="13" r="2.1"/><path d="M10.5 6.6 7.6 11M13.5 6.6 16.4 11M8.1 13v4h7.8v-4"/>',
      'BINARY SEARCH': '<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5M8 10.5h5"/>',
      'HEAP': '<path d="M12 4l7 6H5z"/><circle cx="12" cy="4" r="1.5"/><circle cx="5" cy="10" r="1.5"/><circle cx="19" cy="10" r="1.5"/><path d="M12 13v3M6.6 18.5h10.8"/>',
      'BACKTRACKING': '<path d="M9 20H6a3 3 0 0 1-3-3v-4a3 3 0 0 1 3-3h3"/><path d="M8 6l3.5 3.5L8 13"/><path d="M13 20h5"/>',
      'MATH': '<path d="M5 7h14M5 12h14M5 17h14M9 4v16M15 4v16"/>',
      'ONE DP': '<rect x="4" y="5" width="16" height="14" rx="1.6"/><path d="M4 12h16M9 9.5v5M13 9.5v5"/>',
      'MULTI DP': '<rect x="4" y="5" width="16" height="14" rx="1.6"/><path d="M4 10h16M4 14.5h16M9.5 5v14M15 5v14"/>',
      'GRAPH GENERAL': '<circle cx="6" cy="7" r="2.1"/><circle cx="18" cy="6" r="2.1"/><circle cx="12" cy="18" r="2.1"/><path d="M7.7 8.4 10.6 16M16.4 7.6 13.4 16M8 6.6l7.9-.4"/>',
      'GRAPH BFS': '<circle cx="12" cy="12" r="2.1"/><circle cx="12" cy="4.5" r="1.8"/><circle cx="19" cy="16" r="1.8"/><circle cx="5" cy="16" r="1.8"/><path d="M12 6.3v3.6M13.7 13.3l3.6 1.7M10.3 13.3l-3.6 1.7"/>',
      'TRIE': '<circle cx="12" cy="4.5" r="1.9"/><circle cx="6" cy="12" r="1.9"/><circle cx="18" cy="12" r="1.9"/><circle cx="6" cy="19.5" r="1.9"/><path d="M10.6 6.1 7.3 10.4M13.4 6.1l3.3 4.3M6 13.9v3.7"/>',
      'DIVIDE CONQUER': '<path d="M12 3v5M12 8L5.5 15M12 8l6.5 7"/><circle cx="5.5" cy="18" r="2"/><circle cx="18.5" cy="18" r="2"/><path d="M4 21.5h16"/>',
      'BIT MANIPULATION': '<path d="M6 4v16M11 4v16M16 4v16M21 4v16"/><path d="M3.5 8.5h5M8.5 15.5h5M13.5 8.5h5M18.5 15.5h5"/>',
      'KADANES ALGORITHM': '<path d="M3 17l4.5-6 4 3.5L21 6"/><path d="M15.5 6H21v5.5"/>',
    };
    const catIcon = (cat) =>
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" '
      + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'
      + (CAT_ICON[cat] || CAT_ICON['MAANG GUIDES']) + '</svg>';

    /* A short code that identifies a guide in the number-mode rail. The 150
       problems keep their own LeetCode number, which a reader already knows.
       The 25 non-problem rows would collide with problems 1..4 on a bare leading
       digit, so they get a letter that says which kind of guide they are. */
    const PRIMER_CODE = { 'FOUNDATIONS': 'P', 'MAANG GUIDES': 'G', 'MODERN ENGINEER SKILLS': 'S', 'FRESHER ROADMAP': 'F', 'MID-LEVEL ROADMAP': 'M' };
    const guideCode = (entry, indexInCategory) => {
      const cat = entry.category;
      const letter = PRIMER_CODE[cat];
      if (!letter) {
        const m = /^\s*(\d{1,3})\./.exec(entry.item.title);
        return m ? m[1] : '';
      }
      if (cat === 'MAANG GUIDES') return maangCode(entry.item);
      const own = new RegExp('^\\s*(?:' + letter + ')?(\\d{1,2})\\s*(?:[.)]|—)').exec(entry.item.title);
      if (own) return letter + own[1];
      return letter;
    };
    /* MAANG's five guides carry no number in their titles, so the letter alone
       would repeat five times. Their position in the category is stable — the
       order comes from the build, not from render order — so it is a code that
       never collides and never needs resetting. */
    const maangCode = (item) => {
      const cat = DATA.find(c => c.category === 'MAANG GUIDES');
      const i = cat ? cat.items.findIndex(x => x.id === item.id) : -1;
      return 'G' + (i + 1);
    };

    /* ---------- persistent progress ---------- */
    const LS_KEY = 'lt150-done-v1';
    let doneSet = new Set();
    try { doneSet = new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]')); } catch (e) { doneSet = new Set(); }
    const saveDone = () => { try { localStorage.setItem(LS_KEY, JSON.stringify([...doneSet])); } catch (e) {} };

    /* ---------- state ---------- */
    let activeFilter = 'ALL';
    let searchQuery = '';
    let currentItemId = null;
    let palIndex = 0;
    let palResults = [];

    /* ---------- element refs ---------- */
    const $ = (id) => document.getElementById(id);
    const nav = $('curriculumNav'), contentArea = $('articleContent'), articleHead = $('articleHead'),
      crumbRow = $('crumbRow'), prevNext = $('prevNext'),
      searchInput = $('searchInput'), sidebar = $('sidebar'), sideOverlay = $('sideOverlay'),
      palette = $('palette'), paletteCard = $('paletteCard'), paletteInput = $('paletteInput'),
      paletteList = $('paletteList'), scroller = $('contentContainer'), progressBar = $('progressBar');

    const DIFF_STYLE = {
      Easy: 'background:rgba(52,211,153,.12);color:#34D399;border:1px solid rgba(52,211,153,.3)',
      Medium: 'background:rgba(251,191,36,.12);color:#FBBF24;border:1px solid rgba(251,191,36,.3)',
      Hard: 'background:rgba(251,113,133,.12);color:#FB7185;border:1px solid rgba(251,113,133,.3)',
      Primer: 'background:rgba(200,250,75,.1);color:#C8FA4B;border:1px solid rgba(200,250,75,.3)',
    };
    const badge = (d) => `<span class="nav-badge text-[10px] px-1.5 py-0.5 rounded font-semibold shrink-0 font-mono" style="${DIFF_STYLE[d] || DIFF_STYLE.Primer}">${d}</span>`;
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    /* ---------- row 32: the "Unverified" label ----------
     *
     * A label that is a stored flag rots into a lie the moment the gate behind it moves; that was
     * the rot plan A2 feared. So the rule lives in exactly ONE place — `scripts/lib/v9.mjs`, a pure
     * predicate checked by `node scripts/lib/v9.mjs` — and `scripts/gen-doc-traces.mjs` runs it at
     * build time over the corpus, publishing one verdict per guide in `traces/index.json`.
     *
     * This block only READS that verdict. It does not decide anything, so the badge cannot disagree
     * with the gate: a guide V9 certifies gets no badge at all, and `uncomparable` is rendered as
     * its own state rather than folded into "Unverified", because `test-trace.mjs:1170-1173` is
     * explicit that reporting "no comparison possible" as drift is the same sin as calling it
     * agreement.
     *
     * What this is NOT, contrary to row 32 as originally written: a browser-side pure function of
     * V9. The predicate needs every step's text/operands/snap and only a head's first/last survive
     * into what ships, so the verdict is computed by the build. The row was renamed for that.
     */
    let TABLE_TRACE = null;
    let tableTraceLoad = null;
    const loadTableTrace = () => (tableTraceLoad ||= fetch('traces/index.json', { cache: 'no-cache' })
      .then(r => (r.ok ? r.json() : null))
      .then(i => { TABLE_TRACE = (i && i.guides) || {}; })
      .catch(() => { TABLE_TRACE = {}; }));

    const VERDICT_STYLE = {
      disagrees: 'background:rgba(251,113,133,.12);color:#FB7185;border:1px solid rgba(251,113,133,.35)',
      uncomparable: 'background:rgba(251,191,36,.12);color:#FBBF24;border:1px solid rgba(251,191,36,.35)',
    };
    const VERDICT_TEXT = {
      disagrees: 'Unverified · table disagrees with trace',
      uncomparable: 'Unverified · not comparable',
    };
    /** Empty string when V9 certified the guide — absence of the badge IS the verified state. */
    function verifyLabel(entry) {
      const verdict = TABLE_TRACE && entry.item.relPath ? TABLE_TRACE[entry.item.relPath] : null;
      if (!verdict || !VERDICT_TEXT[verdict.tableTrace]) return '';
      return '<span id="verifyBadge" data-verdict="' + esc(verdict.tableTrace) + '" title="'
        + esc('Row 32: V9 — the authored Level 3 dry-run table of this guide, cross-checked against the trace the code actually ran. '
          + 'Verdict computed at build time by scripts/lib/v9.mjs and published in traces/index.json.')
        + '" class="text-[10px] px-1.5 py-0.5 rounded font-semibold shrink-0 font-mono" style="' + VERDICT_STYLE[verdict.tableTrace] + '">'
        + VERDICT_TEXT[verdict.tableTrace] + '</span>';
    }

    /* ---------- sidebar ---------- */
    function paintFilterPills() {
      document.querySelectorAll('.filter-btn').forEach(b => {
        const on = b.dataset.diff === activeFilter;
        b.style.cssText = on
          ? 'background:#C8FA4B;color:#101303;'
          : 'background:rgba(255,255,255,.04);color:#8B94A7;';
      });
    }

    function renderProgress() {
      const total = flatOrder.length || 1;
      const done = flatOrder.filter(id => doneSet.has(id)).length;
      const pct = Math.round((done / total) * 100);
      $('ringFg').style.strokeDashoffset = String(163.36 * (1 - done / total));
      $('ringPct').textContent = pct + '%';
      $('ringSub').textContent = done + ' / ' + flatOrder.length + ' done';
      $('overallChip').innerHTML = '<span class="inline-block h-1.5 w-1.5 rounded-full" style="background:#C8FA4B"></span>' + pct + '% complete';
    }

    function renderNav() {
      nav.innerHTML = '';
      if (!DATA.length) {
        nav.innerHTML = '<p class="text-sm text-slate-500 px-2">No curriculum data found. Run <span class="font-mono">npm run build</span>.</p>';
        return;
      }
      let shown = 0;
      DATA.forEach(cat => {
        const all = cat.items;
        const items = cat.items.filter(item => {
          const diffOk = activeFilter === 'ALL' ? true : item.difficulty === activeFilter;
          if (!diffOk) return false;
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          return item.title.toLowerCase().includes(q) || item.content.toLowerCase().includes(q);
        });
        if (!items.length) return;
        const isFound = cat.category === 'FOUNDATIONS';
        const doneCount = isFound ? 0 : items.filter(i => doneSet.has(i.id)).length;
        const wrap = document.createElement('div');
        wrap.className = 'nav-group';
        const catDone = all.filter(i => doneSet.has(i.id)).length;
        const catCurrent = all.some(i => i.id === currentItemId);
        /* Category mode's destination: the glyph opens the rail and scrolls to
           this group, so the rail is navigation rather than decoration. */
        const catBtn = document.createElement('button');
        catBtn.type = 'button';
        catBtn.className = 'nav-cat-btn';
        catBtn.dataset.cat = cat.category;
        catBtn.dataset.guideId = all[0] ? all[0].id : '';
        if (catCurrent) catBtn.dataset.current = 'true';
        if (catDone === all.length && all.length) catBtn.dataset.done = 'true';
        catBtn.setAttribute('aria-label', cat.category + ' — ' + catDone + ' of ' + all.length + ' complete');
        catBtn.innerHTML = catIcon(cat.category)
          + '<span class="ltc-sr-only">' + esc(cat.category) + '</span>';
        catBtn.dataset.tip = cat.category;
        catBtn.onclick = () => revealCategory(cat.category);
        wrap.appendChild(catBtn);

        const head = document.createElement('div');
        head.className = 'px-2 pt-1 nav-group-text';
        head.innerHTML = '<div class="flex items-baseline justify-between gap-2">' +
          '<span class="nav-group-label text-[11px] font-bold text-slate-400 uppercase tracking-widest font-display">' + esc(cat.category) + '</span>' +
          (isFound
            ? '<span class="nav-group-count text-[10px] font-mono text-slate-600">' + items.length + '</span>'
            : '<span class="nav-group-count text-[10px] font-mono text-slate-500">' + doneCount + '/' + items.length + '</span>') +
          '</div>' +
          (isFound ? '' : '<div class="mod-bar mt-1.5"><span style="width:' + Math.round((doneCount / items.length) * 100) + '%"></span></div>');
        wrap.appendChild(head);
        const rule = document.createElement('div');
        rule.className = 'nav-group-rule';
        wrap.appendChild(rule);
        const list = document.createElement('div');
        list.className = 'space-y-0.5 mt-1';
        items.forEach(item => {
          const done = doneSet.has(item.id);
          const active = item.id === currentItemId;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'nav-item w-full text-left px-3 py-2.5 rounded-lg text-[13px] flex items-center gap-2 border min-h-[44px] md:min-h-0';
          btn.style.cssText = active
            ? 'background:rgba(200,250,75,.1);color:#fff;border-color:rgba(200,250,75,.35);'
            : 'color:#C2C9D8;border-color:transparent;';
          if (active) btn.setAttribute('aria-current', 'page');
          btn.dataset.guideId = item.id;
          if (done) btn.dataset.done = 'true';
          if (active) btn.dataset.active = 'true';
          btn.onmouseenter = () => { if (!active) btn.style.background = 'rgba(255,255,255,.05)'; };
          btn.onmouseleave = () => { if (!active) btn.style.background = 'transparent'; };
          const code = guideCode({ item, category: cat.category }, 0);
          btn.innerHTML =
            '<span class="nav-mark shrink-0 w-4 text-center font-mono text-[11px]" style="color:' + (done ? '#C8FA4B' : '#3A4358') + '">' + (done ? '✓' : '·') + '</span>' +
            '<span class="nav-code" aria-hidden="true">' + esc(code) + '</span>' +
            '<span class="nav-title truncate flex-1 ' + (done && !active ? 'line-through opacity-60' : '') + '">' + esc(item.title) + '</span>' +
            '<span class="ltc-sr-only">' + esc(item.title) + '</span>' +
            badge(item.difficulty);
          btn.dataset.tip = item.title;
          btn.onclick = () => openArticle(item.id);
          list.appendChild(btn);
        });
        wrap.appendChild(list);
        nav.appendChild(wrap);
        shown += items.length;
      });
      /* An empty result is not a missing build. The sidebar is a flex column and
         the nav takes every pixel the header leaves, so a filter that matches
         nothing used to leave the reader looking at 653px of empty column with
         nothing to say why. */
      if (!shown) {
        nav.innerHTML = '<p class="text-sm text-slate-500 px-2">'
          + (searchQuery
            ? 'No guide matches “' + esc(searchQuery) + '”.'
            : 'No guide has difficulty ' + esc(activeFilter) + '.')
          + '</p>';
      }
      renderProgress();
    }

    /* The collapse control owns stage AND, because the two are the same gesture on
       the same rail, the hidden header fields. renderNav re-reads stage from
       here rather than keeping a second copy that can disagree. */
    function setNavStage(s, persist) {
      const el = $('sidebar'), btn = $('ltNavCollapse');
      if (!el) return;
      const STAGE_LABELS = ['Collapse the navigation',
                            'Collapse the navigation to icons',
                            'Widen the navigation fully'];
      /* The glyph follows the move, not the label. Only stage 2 widens the rail,
         so only stage 2 points right; tying the two paths to the two directions
         the sidebar can travel rather than to three stage indexes — stage 1 goes
         200px → 56px, which narrows, so it points left like stage 0 does. */
      const STAGE_CHEVRONS = ['M15 6l-6 6 6 6', 'M15 6l-6 6 6 6', 'M9 6l6 6-6 6'];
      const stage = ((s % 3) + 3) % 3;
      el.dataset.stage = String(stage);
      if (btn) {
        btn.setAttribute('aria-label', STAGE_LABELS[stage]);
        btn.title = STAGE_LABELS[stage];
        const chev = $('ltNavChevron');
        if (chev) chev.setAttribute('d', STAGE_CHEVRONS[stage]);
      }
      /* ringBlock is the wrapper, not just its contents: at stage 2 hiding the
         ring's children left an empty flex-1 box in the header row, and with it
         the button was pushed off the icon column's centre line. */
      ['ringPct', 'ringSub', 'ringSvg', 'ringBlock'].forEach((id) => {
        const n = $(id); if (n) n.classList.toggle('hidden', stage === 2);
      });
      if (persist) { try { localStorage.setItem('lt150-nav-stage', String(stage)); } catch (e) {} }
    }

    /* One tooltip for the whole rail, parked on <body> and positioned in
       viewport coordinates. Per-item tooltips were unreachable: the nav is the
       scroll container, and overflow-y:auto clips overflow-x too, so anything
       drawn outside the 56px rail never painted. */
    (function initNavTip() {
      const el = $('sidebar');
      const nav = $('curriculumNav');
      if (!el || !nav) return;
      const tip = document.createElement('div');
      tip.className = 'nav-tip';
      tip.setAttribute('aria-hidden', 'true');
      document.body.appendChild(tip);

      const show = (target) => {
        const text = target?.dataset?.tip;
        if (!text) return;
        tip.textContent = text;
        tip.classList.add('is-shown');
        const r = target.getBoundingClientRect();
        // Measure at the rail's edge, then clamp so a long guide title stays on
        // screen instead of running off the right.
        tip.style.left = '0px';
        tip.style.top = '0px';
        const h = tip.offsetHeight, w = tip.offsetWidth;
        const x = r.right + 10;
        tip.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
        tip.style.top = Math.max(8, Math.min(r.top + r.height / 2 - h / 2, innerHeight - h - 8)) + 'px';
      };
      const hide = () => tip.classList.remove('is-shown');

      nav.addEventListener('pointerover', (e) => {
        if (el.dataset.stage !== '2') return;
        const t = e.target.closest('[data-tip]');
        if (t) show(t); else hide();
      });
      nav.addEventListener('pointerleave', hide);
      nav.addEventListener('focusin', (e) => {
        if (el.dataset.stage !== '2') return;
        const t = e.target.closest('[data-tip]');
        if (t) show(t); else hide();
      });
      nav.addEventListener('focusout', hide);
      window.addEventListener('scroll', hide, true);
      window.addEventListener('resize', hide);
    })();

    /* The category glyph doubles as the rail's scroll thumb: since only icons
       show, the reader has no other way to move through 28 of them. */
    (function initRailScroller() {
      const el = $('sidebar');
      const nav = $('curriculumNav');
      if (!el || !nav) return;
      nav.addEventListener('wheel', (e) => {
        if (el.dataset.stage !== '2') return;
        const max = nav.scrollHeight - nav.clientHeight;
        if (max <= 0) return;
        e.preventDefault();
        nav.scrollTop = Math.max(0, Math.min(max, nav.scrollTop + e.deltaY));
      }, { passive: false });
    })();

    /* Opened from a category glyph: widen the rail and scroll the group into
       view, so the click lands somewhere legible instead of just toggling. */
    function revealCategory(category) {
      if ($('sidebar').dataset.stage === '2') setNavStage(0, true);
      requestAnimationFrame(() => {
        const group = [...nav.querySelectorAll('.nav-group')]
          .find(g => g.querySelector('.nav-cat-btn')?.dataset.cat === category);
        if (!group) return;
        /* nav.scrollTop, not scrollIntoView. That walks up every scrollable
           ancestor, and #sidebar is one: overflow:hidden still makes a box
           programmatically scrollable. So it scrolled the sidebar as well,
           pushing the 191px header block out of view and leaving exactly that
           much blank space under the list. */
        nav.scrollTo({
          top: nav.scrollTop + group.getBoundingClientRect().top - nav.getBoundingClientRect().top,
          behavior: 'smooth',
        });
      });
    }

    /* ⌥V swaps what the 56px rail shows: the 28 categories, or the guide
       numbers. Persisted, because a rail that silently resets each session is the
       thing that makes people stop trusting it. */
    (function initRailMode() {
      const el = $('sidebar');
      if (!el) return;
      const KEY = 'lt150-rail-mode';
      let mode = 'cat';
      try { const v = localStorage.getItem(KEY); if (v === 'cat' || v === 'num') mode = v; } catch (e) {}
      const apply = (m, persist) => {
        mode = m === 'num' ? 'num' : 'cat';
        el.dataset.railMode = mode;
        const btn = $('ltNavCollapse');
        if (btn) btn.setAttribute('aria-keyshortcuts', 'Alt+V');
        if (persist) { try { localStorage.setItem(KEY, mode); } catch (e) {} }
      };
      apply(mode, false);
      window.addEventListener('keydown', (e) => {
        if (!e.altKey || e.ctrlKey || e.metaKey) return;
        if (e.key !== 'v' && e.key !== 'V') return;
        const t = e.target;
        if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
        apply(mode === 'cat' ? 'num' : 'cat', true);
        e.preventDefault();
      });
    })();

    /* ---------- article ---------- */
    function renderHead(entry) {
      const { item, category } = entry;
      const done = doneSet.has(item.id);
      crumbRow.classList.remove('hidden');
      crumbRow.classList.add('flex');
      crumbRow.innerHTML = '<span>' + esc(category) + '</span><span>/</span><span class="text-slate-300">' + esc((item.pattern || '').split('/')[0].trim() || item.difficulty) + '</span>';
      articleHead.innerHTML =
        '<div class="flex flex-wrap items-center gap-2 mb-3">' + badge(item.difficulty) +
        verifyLabel(entry) +
        '<span class="text-xs text-slate-500 font-mono">' + esc(item.pattern || '') + '</span></div>' +
        /* One row owns every per-guide control. renderPrevNext appends #prevNext
           into it, which is why the node is moved rather than re-created: it is
           already wired and its dataset has to survive the re-render. */
        '<div id="headRow" class="flex flex-wrap items-center gap-2">' +
        (item.leetcodeLink
          ? '<a href="' + esc(item.leetcodeLink) + '" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 px-4 h-11 rounded-xl font-semibold text-sm min-h-[44px] transition-transform active:scale-95" style="background:#C8FA4B;color:#101303;">Solve on LeetCode' +
            '<svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg></a>'
          : '') +
        '<button id="doneToggle" class="inline-flex items-center gap-2 px-4 h-11 rounded-xl text-sm font-semibold border min-h-[44px] transition-colors" style="' +
            (done ? 'border-color:rgba(200,250,75,.4);color:#C8FA4B;background:rgba(200,250,75,.07);' : 'border-color:rgba(148,163,184,.25);color:#8B94A7;') + '">' +
          '<span>' + (done ? '✓ Completed' : '○ Mark complete') + '</span></button>' +
        '</div>';
      $('doneToggle').onclick = () => {
        if (doneSet.has(item.id)) doneSet.delete(item.id); else doneSet.add(item.id);
        saveDone();
        renderHead(entry);
        renderNav();
      };
      /* renderHead owns prev/next, not openArticle. articleHead.innerHTML above
         discards everything inside it, and the row below is inside it, so any
         re-render of the head detaches a prevNext node parked in that row. The
         trace badge re-renders the head asynchronously after the first paint, so
         the pair used to vanish a moment after the page settled. Re-attaching it
         here means every head render leaves it in place, whenever that is. */
      renderPrevNext();
    }

    function renderPrevNext() {
      /* allOrder, not flatOrder: flatOrder omits the primers, so on a primer page
         indexOf returned -1 and Next jumped to the first MAANG guide instead of
         the next primer. */
      const idx = allOrder.indexOf(currentItemId);
      const entry = (i) => (i >= 0 && i < allOrder.length ? byId.get(allOrder[i]) : null);
      /* The button carries the guide's own code and name — the same pairing the
         sidebar uses — rather than the words "Prev" and "Next". Which neighbour
         it is, the arrow on the outside edge already says. For a problem the
         code is the number the title itself starts with, so it is stripped from
         the title rather than printed twice; for a MAANG guide the title has no
         number at all and the code is the only thing that carries one. */
      const cell = (entry, dir) => {
        if (!entry) return '';
        const code = guideCode(entry, 0);
        const title = entry.item.title.replace(/^\s*\d{1,3}\.\s*/, '');
        const arrow = '<span class="text-slate-500 shrink-0" aria-hidden="true">' + (dir === 'prev' ? '←' : '→') + '</span>';
        const num = code
          ? '<span class="font-mono text-[11px] tabular-nums shrink-0" style="color:var(--accent)">' + esc(code) + '</span>'
          : '';
        const name = '<span class="truncate max-w-[9ch] sm:max-w-[12ch]">' + esc(title) + '</span>';
        return '<button data-nav="' + entry.item.id + '" title="' + esc(entry.item.title) + '"' +
          ' aria-label="' + (dir === 'prev' ? 'Previous: ' : 'Next: ') + esc(entry.item.title) + '"' +
          ' class="inline-flex items-center gap-2 px-3 h-11 rounded-xl border border-[rgba(148,163,184,0.2)] text-sm text-slate-300 hover:bg-white/[0.06] hover:text-slate-100 active:bg-white/10 transition-colors">' +
          (dir === 'prev' ? arrow + num + name : name + num + arrow) +
          '</button>';
      };
      /* Only emit the guides that exist. The bar used to render an empty
         <span> for the missing half, which in a 2-column grid still took half
         the row — a visible hole on the home page and at both ends. */
      const parts = [cell(entry(idx - 1), 'prev'), cell(entry(idx + 1), 'next')].filter(Boolean);
      /* No headRow means the home page, which opens with "Start studying" and has
         no prev/next to offer. Owning that check here rather than in openHome
         keeps one place responsible, and this runs after it. */
      const host = $('headRow');
      if (!host || parts.length === 0) {
        prevNext.hidden = true;
        prevNext.innerHTML = '';
        return;
      }
      prevNext.dataset.count = String(parts.length);
      prevNext.innerHTML = parts.join('');
      prevNext.hidden = false;
      host.appendChild(prevNext);
      prevNext.querySelectorAll('[data-nav]').forEach(b => { b.onclick = () => openArticle(b.dataset.nav); });
    }

    function enhanceCodeBlocks() {
      // Wrap tables for safe mobile horizontal scroll (global fix)
      contentArea.querySelectorAll('table').forEach(tbl => {
        if (tbl.parentElement && tbl.parentElement.classList.contains('table-scroll')) return;
        const wrap = document.createElement('div');
        wrap.className = 'table-scroll';
        tbl.replaceWith(wrap);
        wrap.appendChild(tbl);
      });
      // Tag raw primer file-paths so they show a tooltip instead of looking broken
      // Linkify: bare http(s) code pills (e.g. LeetCode Link) open in a new tab;
      // primer file-paths open the primer inside the portal when it exists.
      contentArea.querySelectorAll('code').forEach(c => {
        if (c.closest('pre')) return;
        const t = c.textContent.trim();
        if (/^https?:\/\//.test(t)) {
          const a = document.createElement('a');
          a.href = t;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.title = 'Open in new tab: ' + t;
          c.replaceWith(a);
          a.appendChild(c);
          return;
        }
        if (/\.md$/.test(t)) {
          const id = t.replace(/\.md$/, '').replace(/\//g, '_');
          if (byId.has(id)) {
            c.classList.add('primer-link');
            c.title = 'Open primer in portal: ' + t;
            c.onclick = () => openArticle(id);
          } else {
            c.classList.add('primer-path');
            c.title = t;
          }
        }
      });
      contentArea.querySelectorAll('pre code').forEach(block => {
        if (block.classList.contains('language-mermaid')) {
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = block.textContent;
          block.parentElement.replaceWith(div);
          return;
        }
        const pre = block.parentElement;
        const wrap = document.createElement('div');
        wrap.className = 'code-wrap relative';
        pre.replaceWith(wrap);
        wrap.appendChild(pre);
        const btn = document.createElement('button');
        btn.className = 'copy-btn absolute top-2 right-2 text-[11px] font-mono px-2.5 py-1.5 rounded-md bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300';
        btn.textContent = 'Copy';
        btn.onclick = async () => {
          const ok = await copyText(block.textContent);
          btn.textContent = ok ? 'Copied ✓' : 'Copy failed';
          setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
        };
        wrap.appendChild(btn);
        // Touch views: double-tap the code box to copy (no button there).
        let lastTap = 0, lastX = 0, lastY = 0, multiTouch = false;
        wrap.addEventListener('touchstart', (e) => {
          if (e.touches.length > 1) multiTouch = true;
        }, { passive: true });
        wrap.addEventListener('touchend', async (e) => {
          if (e.touches.length > 0) return; // still touching (pinch/scroll)
          if (multiTouch) { multiTouch = false; lastTap = 0; return; }
          const t = e.changedTouches[0];
          const now = Date.now();
          const moved = Math.hypot(t.clientX - lastX, t.clientY - lastY);
          if (lastTap > 0 && now - lastTap < 350 && moved < 30) {
            lastTap = 0;
            flashCopied(wrap, await copyText(block.textContent));
          } else {
            lastTap = now; lastX = t.clientX; lastY = t.clientY;
          }
        }, { passive: true });
      });
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          ta.remove();
          return ok;
        } catch (e2) { return false; }
      }
    }

    // Transient "Copied ✓" pill for touch views (no persistent button to update).
    function flashCopied(wrap, ok) {
      wrap.querySelectorAll('.copy-flash').forEach(n => n.remove());
      const pill = document.createElement('span');
      pill.className = 'copy-flash absolute top-2 right-2 text-[11px] font-mono px-2.5 py-1.5 rounded-md bg-white/5 border border-white/10 text-slate-300';
      pill.textContent = ok ? 'Copied ✓' : 'Copy failed';
      wrap.appendChild(pill);
      setTimeout(() => pill.remove(), 1500);
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    async function openArticle(id) {
      const entry = byId.get(id);
      if (!entry) return;
      currentItemId = id;
      renderNav();
      renderHead(entry);
      // Row 32's verdict arrives after the first paint, so the label lands without gating a guide
      // on a fetch. Re-render only if the reader is still on this page — otherwise the badge for
      // the guide they left would overwrite the one they are reading.
      loadTableTrace().then(() => {
        if (currentItemId === id) renderHead(byId.get(id));
      });
      if (window.marked && marked.parse) {
        contentArea.innerHTML = marked.parse(entry.item.content);
      } else {
        contentArea.innerHTML = '<pre>' + escapeHtml(entry.item.content) + '</pre>';
      }
      enhanceCodeBlocks();
      if (window.Prism && Prism.highlightAllUnder) {
        try { Prism.highlightAllUnder(contentArea); } catch (e) {}
      }
      if (window.mermaid) {
        try {
          mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose',
            flowchart: { htmlLabels: true, curve: 'basis', padding: 12, nodeSpacing: 40, rankSpacing: 50 },
            themeVariables: { edgeLabelBackground: '#1A2130', primaryTextColor: '#E9EDF4' }
          });
          await mermaid.run();
        } catch (e) {}
      }
      // Global math fix: render $...$ / $$...$$ outside pre/code (skips JS template literals)
      if (window.renderMathInElement) {
        try {
          renderMathInElement(contentArea, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ],
            ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
            throwOnError: false
          });
        } catch (e) {}
      }
      renderJudgePanel(entry);
      scroller.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
      history.replaceState(null, '', '#' + id);
      closeSidebar();
      updateProgressBar();
      // Let the chat widget know the visible guide changed. It re-reads the DOM
      // itself (the hash above is the source of truth), so a dropped event only
      // costs a stale header label.
      document.dispatchEvent(new CustomEvent('lt150:article', { detail: { id: id, title: entry.item.title } }));
    }

    async function refreshAuth() {

      if (!me || typeof me.githubId !== 'number') { paintLoggedOut(); return; }
      judgeUser = me;
      // Union server progress into the local set (server is source of truth going forward).
      (me.done || []).forEach(id => {
        const guideId = Object.keys(PILOT).find(g => PILOT[g].slug === id);

      area.innerHTML =

        '<button id="logoutBtn" class="inline-flex items-center justify-center px-3 h-10 rounded-lg text-[13px] font-semibold border" style="border-color:rgba(148,163,184,.25);color:#8B94A7;">Logout</button></div>';
      $('logoutBtn').onclick = async () => {

    function renderJudgePanel(entry) {

      if (!pilot) return;
      const draftKey = 'lt150-draft-' + pilot.slug;
      let draft = null;
      try { draft = localStorage.getItem(draftKey); } catch (e) {}
      const stub = 'function ' + pilot.fn + '(...args) {\n  // TODO: implement\n  return null;\n}\n';
      const sec = document.createElement('section');
      sec.innerHTML =
        '<h2 id="sec-try-live">Try it live <span class="text-[11px] font-mono font-normal text-slate-500 align-middle">pilot · runs on the server sandbox</span></h2>' +
        '<p>Write <code>' + esc(pilot.fn) + '</code> below and run it against the pilot test set. A full pass marks this guide complete' + (judgeUser ? ' (synced to your account)' : ' (login to sync it to your account)') + '.</p>' +
        '<textarea id="judgeCode" spellcheck="false" rows="8" class="w-full rounded-xl border border-[rgba(148,163,184,0.2)] bg-[#0A0D13] p-3.5 font-mono text-[13px] leading-relaxed text-slate-200 focus:outline-none focus:border-[#C8FA4B]/60" style="font-family:var(--font-mono);"></textarea>' +
        '<div class="flex flex-wrap items-center gap-3 mt-3">' +
        '<button id="judgeRun" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl font-semibold text-sm min-h-[44px] transition-transform active:scale-95" style="background:#C8FA4B;color:#101303;">Run tests</button>' +
        '<span id="judgeStatus" class="text-[13px] font-mono text-slate-500"></span></div>' +
        '<div id="judgeVerdict" class="mt-3"></div>';
      contentArea.appendChild(sec);
      const ta = $('judgeCode');
      ta.value = draft || stub;
      ta.oninput = () => { try { localStorage.setItem(draftKey, ta.value); } catch (e) {} };
      const paintVerdict = (v) => {
        const box = $('judgeVerdict');
        if (!v) { box.innerHTML = ''; return; }
        if (v.error && !v.tests?.length) {
          box.innerHTML = '<div class="rounded-xl border border-[rgba(251,113,133,.35)] bg-[rgba(251,113,133,.07)] px-4 py-3 text-sm text-slate-200">Error: ' + esc(String(v.error)) + '</div>';
          return;
        }
        const rows = (v.tests || []).map(t =>
          '<tr><td>' + esc(t.name || '') + '</td><td class="font-mono">' + (t.ok ? '<span style="color:#34D399">pass</span>' : '<span style="color:#FB7185">fail</span>') + '</td>' +
          '<td class="font-mono text-xs">' + esc(t.expected !== undefined ? JSON.stringify(t.expected) : '') + '</td>' +
          '<td class="font-mono text-xs">' + esc(t.got !== undefined ? JSON.stringify(t.got) : '') + '</td></tr>').join('');
        box.innerHTML =
          '<div class="table-scroll"><table><thead><tr><th>Test</th><th>Result</th><th>Expected</th><th>Got</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
          '<p class="mt-2 text-sm font-semibold ' + (v.failed === 0 && !v.error ? '' : 'text-slate-400') + '" ' + (v.failed === 0 && !v.error ? 'style="color:#C8FA4B"' : '') + '>' +
          esc(v.failed === 0 && !v.error ? 'All ' + v.passed + ' tests passed ✓' : v.passed + ' passed · ' + v.failed + ' failed') +
          (v.error ? ' · ' + esc(String(v.error)) : '') + (v.truncated ? ' · output truncated' : '') + '</p>';
      };
      $('judgeRun').onclick = async () => {
        if (!judgeUser) {
          $('judgeStatus').textContent = 'Login with GitHub first to run code.';
          return;
        }
        $('judgeRun').disabled = true;
        $('judgeStatus').textContent = 'Running…';
        paintVerdict(null);
        try {
          const r = await fetch('/api/judge/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ problemId: pilot.slug, code: ta.value }),
          });
          const v = await r.json();
          $('judgeStatus').textContent = '';
          paintVerdict(r.ok ? v : { error: (v && v.error) || ('HTTP ' + r.status) });
          if (r.ok && v && !v.error && v.failed === 0 && v.passed > 0) {
            doneSet.add(entry.item.id);
            saveDone();
            renderNav();
            renderHead(entry);
          }
        } catch (e) {
          $('judgeStatus').textContent = '';
          paintVerdict({ error: 'Judge API unreachable. Deploy with /api support to run code.' });
        }
        $('judgeRun').disabled = false;
      };
    }

    function checkLoginError() {
      try {
        const q = new URLSearchParams(location.search);
        const err = q.get('login_error');
        if (!err) return;
        q.delete('login_error');
        history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash);
        const bar = document.createElement('div');
        bar.className = 'mx-auto max-w-3xl mt-3 px-4 py-2.5 rounded-xl text-sm border';
        bar.style.cssText = 'border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.07);color:#E9EDF4;';
        bar.textContent = 'GitHub login failed (' + err + '). Please try again.';
        contentArea.prepend(bar);
      } catch (e) {}
    }

    /* ---------- sidebar open/close (mobile) ---------- */
    function openSidebar() {
      sidebar.classList.remove('-translate-x-full');
      sideOverlay.classList.remove('hidden');
    }
    function closeSidebar() {
      if (window.innerWidth >= 768) return;
      sidebar.classList.add('-translate-x-full');
      sideOverlay.classList.add('hidden');
    }
    $('menuBtn').onclick = openSidebar;
    sideOverlay.onclick = closeSidebar;
    $('sideClose').onclick = closeSidebar;

    /* ---------- left nav collapse, two stages (item E) ---------- */
    (function initNavCollapse() {
      const el = $('sidebar'), btn = $('ltNavCollapse');
      if (!el || !btn) return;
      const KEY = 'lt150-nav-stage';
      let stage = 0;
      try { const v = parseInt(localStorage.getItem(KEY), 10); if (v >= 0 && v <= 2) stage = v; } catch (e) {}
      setNavStage(stage, false);
      btn.onclick = () => {
        stage = parseInt(el.dataset.stage, 10) || 0;
        setNavStage(stage + 1, true);
      };
    })();

    /* ---------- rail resize (item C) ---------- */
    (function initRailResize() {
      const el = $('ltRail'), handle = $('ltRailResizer');
      if (!el || !handle) return;
      const MIN = 320, MAX = 720, DEF = 380, KEY = 'lt150-rail-w';
      const clamp = (v) => Math.min(MAX, Math.max(MIN, Math.round(v)));
      const apply = (w, persist) => {
        w = clamp(w);
        document.documentElement.style.setProperty('--lt-rail-w', w + 'px');
        handle.setAttribute('aria-valuenow', String(w));
        if (persist) { try { localStorage.setItem(KEY, String(w)); } catch (e) {} }
        return w;
      };
      let saved = DEF;
      try { const v = parseInt(localStorage.getItem(KEY), 10); if (v) saved = v; } catch (e) {}
      apply(saved, false);

      const widthFromX = (x) => window.innerWidth - x;
      let dragging = false, startX = 0, moved = false;
      const onMove = (e) => {
        if (!dragging || Math.abs(e.clientX - startX) < 3) return;
        moved = true;
        apply(widthFromX(e.clientX), true);
      };
      const onUp = (e) => {
        dragging = false;
        handle.classList.remove('is-dragging');
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        if (moved) apply(widthFromX(e.clientX), true);
      };
      // Document-level listeners, not setPointerCapture, which suppresses the
      // compatibility click and dblclick events. The width only changes after
      // real movement: a plain click must not nudge the rail, or the handle
      // slides out from under the second click of a double-click.
      handle.addEventListener('pointerdown', (e) => {
        dragging = true; moved = false; startX = e.clientX;
        handle.classList.add('is-dragging');
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
        document.addEventListener('pointercancel', onUp);
      });
      handle.addEventListener('dblclick', () => { apply(DEF, true); });
      handle.addEventListener('keydown', (e) => {
        const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--lt-rail-w'), 10) || DEF;
        if (e.key === 'ArrowLeft') { apply(cur + 32, true); e.preventDefault(); }
        if (e.key === 'ArrowRight') { apply(cur - 32, true); e.preventDefault(); }
      });
    })();
    $('brandHome').onclick = (e) => {
      e.preventDefault();
      openHome();
    };

    /* ---------- filters ---------- */
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => { activeFilter = btn.dataset.diff; paintFilterPills(); renderNav(); };
    });
    searchInput.oninput = (e) => { searchQuery = e.target.value; renderNav(); };

    /* ---------- command palette ---------- */
    function fuzzyMatch(hay, needle) {
      hay = hay.toLowerCase();
      needle = needle.toLowerCase().replace(/\s+/g, '');
      let hi = 0;
      for (const ch of needle) {
        hi = hay.indexOf(ch, hi);
        if (hi === -1) return false;
        hi++;
      }
      return true;
    }
    function openPalette() {
      palette.classList.remove('hidden');
      requestAnimationFrame(() => {
        palette.classList.remove('opacity-0');
        paletteCard.classList.remove('opacity-0', 'scale-[0.98]');
      });
      paletteInput.value = '';
      updatePalette('');
      setTimeout(() => paletteInput.focus(), 30);
    }
    function closePalette() {
      palette.classList.add('opacity-0');
      paletteCard.classList.add('opacity-0', 'scale-[0.98]');
      setTimeout(() => palette.classList.add('hidden'), 150);
      paletteInput.blur();
    }
    function updatePalette(q) {
      const query = q.trim();
      palResults = flatOrder
        .map(id => byId.get(id))
        .filter(e => !query || fuzzyMatch(e.item.title + ' ' + (e.item.pattern || '') + ' ' + e.category, query))
        .slice(0, 12);
      palIndex = 0;
      paletteList.innerHTML = palResults.length ? '' : '<p class="text-sm text-slate-500 px-3 py-6 text-center">No matches. Try a pattern name like “sliding window”.</p>';
      palResults.forEach((e, i) => {
        const done = doneSet.has(e.item.id);
        const div = document.createElement('div');
        div.className = 'pal-item flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer';
        div.setAttribute('role', 'option');
        div.setAttribute('aria-selected', i === palIndex ? 'true' : 'false');
        div.innerHTML =
          '<span class="font-mono text-[11px] w-4 text-center shrink-0" style="color:' + (done ? '#C8FA4B' : '#3A4358') + '">' + (done ? '✓' : '·') + '</span>' +
          '<span class="flex-1 min-w-0"><span class="block text-sm text-slate-200 truncate">' + esc(e.item.title) + '</span>' +
          '<span class="block text-[11px] text-slate-500 font-mono truncate">' + esc(e.category) + '</span></span>' +
          badge(e.item.difficulty);
        div.onclick = () => { closePalette(); openArticle(e.item.id); };
        div.onmousemove = () => { palIndex = i; paintPalSelection(); };
        paletteList.appendChild(div);
      });
    }
    function paintPalSelection() {
      paletteList.querySelectorAll('.pal-item').forEach((el, i) => el.setAttribute('aria-selected', i === palIndex ? 'true' : 'false'));
    }
    $('paletteBtn').onclick = openPalette;
    $('guidesBtn').onclick = () => openArticle('24-maang-guides_01-maang-sde-roadmap');
    paletteInput.oninput = (e) => updatePalette(e.target.value);
    paletteInput.onkeydown = (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); palIndex = Math.min(palIndex + 1, palResults.length - 1); paintPalSelection(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); palIndex = Math.max(palIndex - 1, 0); paintPalSelection(); }
      else if (e.key === 'Enter' && palResults[palIndex]) { closePalette(); openArticle(palResults[palIndex].item.id); }
      else if (e.key === 'Escape') closePalette();
    };
    palette.addEventListener('click', (e) => { if (e.target === palette.firstElementChild || e.target === palette) closePalette(); });
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); palette.classList.contains('hidden') ? openPalette() : closePalette(); }
      else if (e.key === 'Escape') { if (!palette.classList.contains('hidden')) closePalette(); else closeSidebar(); }
    });

    /* ---------- reading progress ---------- */
    function updateProgressBar() {
      const max = scroller.scrollHeight - scroller.clientHeight;
      const pct = max > 0 ? (scroller.scrollTop / max) * 100 : 0;
      progressBar.style.width = pct + '%';
    }
    scroller.addEventListener('scroll', updateProgressBar, { passive: true });

    /* ---------- in-article cross-links (#<article-id>) ---------- */
    // Guide pages link to each other via #bundle-id anchors. Open those as
    // articles; leave #sec-N TOC anchors to default smooth-scroll behavior.
    contentArea.addEventListener('click', (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const id = a.getAttribute('href').slice(1);
      if (id && byId.has(id)) { e.preventDefault(); openArticle(id); }
    });

    /* ---------- init ---------- */
    paintFilterPills();
    renderNav();
    // Row 32: warm the per-guide verdict index so the first guide a reader opens already has it.
    loadTableTrace();
    refreshAuth();
    const startId = location.hash ? location.hash.slice(1) : null;
    if (startId && byId.has(startId)) openArticle(startId);
    else openHome();
    checkLoginError();
    updateProgressBar();

    /* A pasted #guide URL, or the browser's own Back/Forward, changes the hash
       without reloading — and nothing listened, so the page silently stayed on
       the old guide while the address bar claimed otherwise. */
    window.addEventListener('hashchange', () => {
      const id = location.hash.slice(1);
      if (!id) { openHome(); return; }
      if (byId.has(id) && id !== currentItemId) openArticle(id);
    });
  </script>
  <script src="chat-widget.js"></script>
  <!-- Row 22: the dry-run table player. A module, imported once, no global (plan G4);
       it attaches to the existing `lt150:article` event, so openArticle() is untouched.
       Deferred like every module, hence its own initial mount for the hash article. -->
  <script type="module" src="dryrun/index.js"></script>
</body>
</html>
