  <style>
    :root {
      --bg: #08090D;
      --surface: #0D1017;
      --raised: #121724;
      --line: rgba(148, 163, 184, 0.13);
      --ink: #E9EDF4;
      --muted: #8B94A7;
      --accent: #C8FA4B;
      --accent-ink: #101303;
    }
    html { background: var(--bg); overflow-x: hidden; overflow-x: clip; }
    body { overflow-x: hidden; overflow-x: clip;
      background:
      radial-gradient(1100px 420px at 85% -10%, rgba(200, 250, 75, 0.055), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(139, 92, 246, 0.06), transparent 60%),
      var(--bg);
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #232B3D; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: #2E3850; }

    .font-display { font-family: "Space Grotesk", Inter, system-ui, sans-serif; }
    .prose { color: #C6CDDB; font-size: 0.95rem; line-height: 1.72; }
    .prose pre {
      background: #0A0D13 !important;
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      padding: 1rem 1.1rem;
      overflow-x: auto;
      font-size: 0.82rem;
      line-height: 1.6;
    }
    .prose pre code { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
    .prose .table-scroll { overflow-x: auto; margin: 1.4rem 0; border: 1px solid var(--line); border-radius: 0.75rem; }
    /* Codeboxes carry their own rhythm (same 1.4rem as tables/diagrams) so gaps
       never depend on the neighbour; the inner pre margin from the Prism theme
       is neutralised so it can't leak through the wrap. */
    .prose .code-wrap { margin: 1.4rem 0; }
    .prose .code-wrap > pre { margin-top: 0; margin-bottom: 0; }
    .prose .table-scroll table { margin: 0; min-width: 640px; }
    .prose table { width: 100%; border-collapse: collapse; margin: 1.4rem 0; font-size: 0.85rem; }
    .prose th, .prose td { border: 1px solid var(--line); padding: 0.55rem 0.9rem; text-align: left; white-space: normal; overflow-wrap: anywhere; }
    .prose th { background: rgba(200, 250, 75, 0.06); font-weight: 600; color: var(--accent); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .prose h1 { font-family: "Space Grotesk", sans-serif; font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 700; color: #fff; letter-spacing: -0.02em; margin-bottom: 1rem; }
    .prose h2 { font-family: "Space Grotesk", sans-serif; font-size: 1.3rem; font-weight: 600; color: #fff; letter-spacing: -0.01em; margin-top: 2.4rem; margin-bottom: 0.8rem; padding-bottom: 0.45rem; border-bottom: 1px solid var(--line); scroll-margin-top: 5rem; }
    .prose h3 { font-size: 1.02rem; font-weight: 600; color: var(--accent); margin-top: 1.4rem; margin-bottom: 0.5rem; }
    .prose p { margin-bottom: 0.95rem; }
    .prose ul, .prose ol { margin-left: 1.4rem; margin-bottom: 1rem; }
    .prose li { margin-bottom: 0.35rem; }
    .prose li::marker { color: var(--accent); }
    .prose code:not(pre code) {
      background: rgba(200, 250, 75, 0.09); color: var(--accent);
      padding: 0.15rem 0.42rem; border-radius: 0.375rem;
      font-size: 0.85em; font-family: "JetBrains Mono", monospace; white-space: normal;
      overflow-wrap: anywhere; word-break: break-word;
    }
    .prose code.primer-path { background: rgba(139,148,167,.12); color: #AEB8CC; cursor: help; }
    .prose code.primer-link { cursor: pointer; }
    .prose code.primer-link:hover { background: rgba(200,250,75,.18); }
    .prose a > code { text-decoration: underline; text-underline-offset: 3px; }
    /* Long unbreakable runs (bare URLs in Sources lists, slash-joined codes
       like (200/201/…) in Q&A) must wrap — otherwise they force the flex
       article wider than the viewport and show blank space on mobile. */
    .prose p, .prose a, .prose li { overflow-wrap: anywhere; }
    .katex { font-size: 1.02em; position: relative; }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.4rem 0; }
    .prose blockquote { border-left: 3px solid var(--accent); padding-left: 1rem; color: var(--muted); margin: 1rem 0; }
    .mermaid {
      background: #0A0D13; border: 1px solid var(--line); border-radius: 0.75rem;
      padding: 1.25rem; margin: 1.4rem 0; display: flex; justify-content: center; overflow-x: auto;
      align-items: flex-start;
    }
    .mermaid svg { max-width: 620px !important; width: 100%; height: auto; }
    .mermaid .edgeLabel { background-color: #1A2130 !important; color: #E9EDF4 !important; }
    .nav-item { transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
    .mod-bar { height: 3px; border-radius: 999px; background: #1C2333; overflow: hidden; }
    .mod-bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.3s ease; }
    #sidebar { transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1); }
    #palette { transition: opacity 0.15s ease; }
    #paletteCard { transition: transform 0.15s ease, opacity 0.15s ease; }
    .pal-item[aria-selected="true"] { background: rgba(200, 250, 75, 0.1); }
    .copy-btn { opacity: 0; transition: opacity 0.15s ease, background-color 0.15s ease; }
    .code-wrap:hover .copy-btn, .copy-btn:focus-visible { opacity: 1; }
    /* Touch views: no dedicated button (it overlaps code) — double-tap the box to copy instead. */
    .code-wrap { touch-action: manipulation; }
    @media (hover: none) {
      .copy-btn { display: none; }
      /* Touch browsers: hide all scrollbars (code/table/panel) — touch scroll
         still works. The reading-progress hairline at the very top stays. */
      * { scrollbar-width: none; -ms-overflow-style: none; }
      *::-webkit-scrollbar { display: none; }
    }
    .toc-link { transition: color 0.15s ease, border-color 0.15s ease; }
    .toc-link.active { color: var(--accent); border-color: var(--accent); }

    /* One-liner page navigation. Only the section in view, plus any section
       the reader opened by hand, is painted; everything else is display:none
       so it drops out of the flow and cannot scroll. */
    .toc-sec { display: none; }
    .toc-sec.is-active,
    .toc-sec[data-user-open="true"] { display: block; }
    .toc-row { display: flex; align-items: center; gap: 0.25rem; }
    .toc-sec.is-active .toc-link { color: var(--accent); }
    .toc-toggle { transition: color 0.15s ease, transform 0.2s cubic-bezier(0.32, 0.72, 0, 1); }
    .toc-toggle svg { transition: transform 0.2s cubic-bezier(0.32, 0.72, 0, 1); }
    .toc-sec[data-collapsed="false"] .toc-toggle svg { transform: rotate(90deg); }
    .toc-toggle:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; border-radius: 3px; }

    /* Children hang off a guide line so they read as children of the heading
       above them. The row is a 1fr grid so it can animate to auto height. */
    .toc-sub {
      display: grid; grid-template-rows: 0fr;
      transition: grid-template-rows 0.22s cubic-bezier(0.32, 0.72, 0, 1);
      margin-left: 0.55rem; padding-left: 0.7rem;
      border-left: 1px solid rgba(148, 163, 184, 0.22);
    }
    .toc-sec[data-collapsed="false"] .toc-sub { grid-template-rows: 1fr; }
    .toc-sub-inner { overflow: hidden; }
    .toc-sub-link {
      display: block; padding: 0.2rem 0.25rem 0.2rem 0.4rem;
      font-size: 12px; color: #7C8699; text-align: left;
      border-left: 2px solid transparent; transition: color 0.15s ease, border-color 0.15s ease, opacity 0.2s ease;
    }
    .toc-sub-link:hover { color: var(--accent); }
    .toc-sub-link.is-current { color: var(--accent); border-left-color: var(--accent); }

    /* Staggered cascade: children rise in sequence once the row has opened. */
    .toc-sec[data-collapsed="false"] .toc-sub-link { animation: toc-rise 0.22s ease both; }
    @keyframes toc-rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .toc-sub, .toc-toggle, .toc-toggle svg { transition: none; }
      .toc-sec[data-collapsed="false"] .toc-sub-link { animation: none; }
    }
    kbd.k {
      font-family: "JetBrains Mono", monospace; font-size: 0.68rem;
      background: #1A2130; border: 1px solid #2A3448; border-bottom-width: 2px;
      border-radius: 0.375rem; padding: 0.1rem 0.4rem; color: #AEB8CC;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    }

    /* ---------- AI chat widget (docs/chat-widget.js) ---------- */
    /* Desktop: a flex sibling of <main>, always present. Mobile: a bottom sheet
       revealed by the FAB. Both layouts live here so the widget markup stays
       one element and the JS only has to know which mode it is in. */
    .ltc-panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      height: 72dvh; display: flex; flex-direction: column; min-height: 0;
      background: var(--surface); border-top: 1px solid var(--line);
      box-shadow: 0 -18px 48px rgba(0, 0, 0, 0.55);
      transform: translateY(101%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      visibility: hidden;
    }
    .ltc-panel.is-open { transform: translateY(0); visibility: visible; }
    .lt-rail { display: contents; }
    .lt-rail-toc { display: none; }
    #ltRailResizer { display: none; }
    @media (min-width: 768px) {
      #sidebar[data-stage="1"] { width: 200px; }
      #sidebar[data-stage="2"] { width: 56px; }
      #sidebar[data-stage="1"] .nav-badge,
      #sidebar[data-stage="2"] .nav-badge { display: none; }
      #sidebar[data-stage="2"] .nav-title,
      #sidebar[data-stage="2"] .nav-group-label,
      #sidebar[data-stage="2"] .nav-group-count { display: none; }
      /* At 56px these collapse to unusable slivers, so they go too. */
      #sidebar[data-stage="2"] #searchInput,
      #sidebar[data-stage="2"] #difficultyFilters { display: none; }
      #sidebar[data-stage="2"] .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
      #sidebar[data-stage="2"] .nav-item > .shrink-0 { width: auto; }
      #ltNavCollapse { display: flex; }
    }
    .ltc-backdrop {
      position: fixed; inset: 0; z-index: 39; background: rgba(0, 0, 0, 0.6);
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .ltc-backdrop.is-open { opacity: 1; pointer-events: auto; }
    @media (min-width: 1024px) {
      .ltc-backdrop { display: none; }
      .lt-rail {
        display: flex; flex-direction: column; min-height: 0;
        position: sticky; top: 3.5rem; align-self: flex-start;
        flex: 0 0 var(--lt-rail-w, 380px); width: var(--lt-rail-w, 380px);
        height: calc(100dvh - 3.5rem);
        border-left: 1px solid var(--line);
      }
      /* Sits entirely left of the rail: overlapping the panel put the chat log
         on top of it, and z-index did not reliably win. */
      #ltRailResizer {
        display: block; position: absolute; left: -9px; top: 0; bottom: 0;
        width: 9px; cursor: col-resize; touch-action: none; background: none;
        user-select: none; -webkit-user-select: none;
      }
      #ltRailResizer::after {
        content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 3px;
        background: transparent; transition: background 0.15s ease;
      }
      #ltRailResizer:hover::after,
      #ltRailResizer:focus-visible::after,
      #ltRailResizer.is-dragging::after { background: var(--accent); }
      #ltRailResizer:focus-visible { outline: none; }
      .lt-rail-toc {
        display: block; flex: 0 1 auto; max-height: 45%;
        overflow-y: auto; padding: 1.5rem 0 0.75rem 1rem;
      }
      .ltc-panel {
        position: static; top: auto; left: auto; right: auto; bottom: auto;
        flex: 1 1 auto; width: 100%; height: auto; min-height: 0;
        transform: none; visibility: visible; box-shadow: none;
        border-top: 1px solid var(--line); border-left: none;
        background: #0B0D12;
      }
    }
    .ltc-head {
      display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0;
      padding: 0.7rem 0.75rem 0.7rem 0.85rem;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(200, 250, 75, 0.035), transparent);
    }
    .ltc-head-mark {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; flex-shrink: 0; border-radius: 9px;
      color: var(--accent-ink);
      background: linear-gradient(140deg, #D8FF6B, #A8DE2C);
      box-shadow: 0 3px 12px rgba(200, 250, 75, 0.22);
    }
    .ltc-head-mark svg { width: 17px; height: 17px; }
    .ltc-head-txt { min-width: 0; }
    .ltc-head-title {
      font-family: "Space Grotesk", sans-serif; font-size: 0.82rem; font-weight: 700;
      letter-spacing: -0.01em; color: #fff; line-height: 1.2;
    }
    .ltc-head-sub {
      font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      line-height: 1.35; margin-top: 1px;
    }
    .ltc-head-actions { margin-left: auto; display: flex; align-items: center; gap: 0.3rem; }
    /* Live context state. The premise of this widget is that it can see the
       page, and until now nothing on screen said so. */
    .ltc-status {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.2rem 0.5rem; border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: rgba(255, 255, 255, 0.03);
      font-family: "JetBrains Mono", monospace; font-size: 9.5px;
      color: var(--muted); white-space: nowrap;
      transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
    }
    .ltc-status-dot {
      width: 6px; height: 6px; border-radius: 999px; flex-shrink: 0;
      background: #34D399; box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5);
    }
    .ltc-panel[data-streaming="true"] .ltc-status {
      color: var(--accent); border-color: rgba(200, 250, 75, 0.3);
      background: rgba(200, 250, 75, 0.08);
    }
    .ltc-panel[data-streaming="true"] .ltc-status-dot {
      background: var(--accent);
      animation: ltc-pulse 1.1s ease-out infinite;
    }
    @keyframes ltc-pulse {
      0% { box-shadow: 0 0 0 0 rgba(200, 250, 75, 0.5); }
      70% { box-shadow: 0 0 0 7px rgba(200, 250, 75, 0); }
      100% { box-shadow: 0 0 0 0 rgba(200, 250, 75, 0); }
    }
    @media (max-width: 1180px) { .ltc-status-txt { display: none; } .ltc-status { padding: 0.35rem; } }
    .ltc-icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; flex-shrink: 0; padding: 0; border-radius: 9px;
      border: 1px solid transparent; background: transparent;
      color: var(--muted); cursor: pointer;
      transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }
    .ltc-icon-btn svg { width: 15px; height: 15px; }
    .ltc-icon-btn:hover {
      color: #E9EDF4; background: rgba(255, 255, 255, 0.07);
      border-color: rgba(148, 163, 184, 0.18);
    }
    .ltc-icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (min-width: 1024px) { .ltc-close { display: none; } }
    .ltc-log-wrap { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
    .ltc-log {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
      padding: 1rem 0.9rem 1.25rem; display: flex; flex-direction: column; gap: 1.15rem;
      scrollbar-width: thin; scrollbar-color: rgba(148, 163, 184, 0.25) transparent;
    }
    .ltc-log::-webkit-scrollbar { width: 9px; }
    .ltc-log::-webkit-scrollbar-track { background: transparent; }
    .ltc-log::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2); border-radius: 999px;
      border: 2px solid transparent; background-clip: content-box;
    }
    .ltc-log::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.34); background-clip: content-box; }
    .ltc-scroll-down {
      position: absolute; left: 50%; bottom: 0.75rem; z-index: 2;
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(20, 25, 36, 0.86); color: #C6CDDB;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      opacity: 0; transform: translate(-50%, 10px) scale(0.9); pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .ltc-scroll-down svg { width: 16px; height: 16px; }
    .ltc-scroll-down.is-shown { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
    .ltc-scroll-down:hover { color: #fff; border-color: rgba(200, 250, 75, 0.4); }
    .ltc-scroll-down:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .ltc-empty {
      margin: auto 0; display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 1.5rem 0.35rem 1rem;
      animation: ltc-rise 0.4s cubic-bezier(0.32, 0.72, 0, 1) both;
    }
    .ltc-empty-mark {
      display: inline-flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; border-radius: 13px; margin-bottom: 0.9rem;
      color: var(--accent);
      background: rgba(200, 250, 75, 0.08);
      border: 1px solid rgba(200, 250, 75, 0.2);
    }
    .ltc-empty-mark svg { width: 22px; height: 22px; }
    .ltc-empty-title {
      font-family: "Space Grotesk", sans-serif; font-weight: 700; color: #fff;
      font-size: 1.05rem; letter-spacing: -0.02em; margin: 0 0 0.3rem;
    }
    .ltc-empty-page {
      font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--accent);
      margin: 0 0 0.5rem; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .ltc-empty-badge {
      display: inline-block; margin-bottom: 0.7rem;
      padding: 0.15rem 0.5rem; border-radius: 999px;
      border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03);
      font-family: "JetBrains Mono", monospace; font-size: 9.5px;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
    }
    .ltc-empty-sub { font-size: 0.8rem; color: var(--muted); line-height: 1.6; margin: 0; max-width: 34ch; }
    .ltc-suggestions {
      display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center;
      margin-top: 1.1rem; width: 100%;
    }
    .ltc-chip {
      border: 1px solid rgba(148, 163, 184, 0.18); background: rgba(255, 255, 255, 0.03);
      color: #C6CDDB; border-radius: 999px; padding: 0.45rem 0.8rem;
      font-size: 11.5px; font-family: "Inter", system-ui, sans-serif;
      text-align: left; line-height: 1.4; min-height: 34px; cursor: pointer;
      transition: background-color 0.16s ease, border-color 0.16s ease,
                  color 0.16s ease, transform 0.16s ease;
    }
    .ltc-chip:hover {
      background: rgba(200, 250, 75, 0.08); border-color: rgba(200, 250, 75, 0.34);
      color: #E9EDF4; transform: translateY(-1px);
    }
    .ltc-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .ltc-chip:active { transform: translateY(0); }
    /* Messages: the assistant speaks in full-width prose with a small mark, the
       reader gets a right-aligned pill. No ASSISTANT/YOU caption rows — those
       read like a debug log and told the reader nothing they could not see. */
    .ltc-msg { display: flex; flex-direction: column; gap: 0.35rem; }
    .ltc-msg--user { align-items: flex-end; }
    .ltc-msg-head { display: flex; align-items: center; min-height: 0; }
    .ltc-mark {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 6px; color: var(--accent);
      background: rgba(200, 250, 75, 0.1); border: 1px solid rgba(200, 250, 75, 0.18);
    }
    .ltc-mark svg { width: 12px; height: 12px; }
    .ltc-mark--busy { animation: ltc-mark-pulse 1.3s ease-in-out infinite; }
    @keyframes ltc-mark-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .ltc-msg-body {
      font-size: 0.855rem; line-height: 1.68; color: #D3DAE7;
      max-width: 100%; overflow-wrap: anywhere;
    }
    .ltc-msg--user { max-width: 92%; }
    .ltc-msg--user .ltc-msg-body {
      background: var(--raised); border: 1px solid var(--line);
      color: #E9EDF4; border-radius: 14px 14px 4px 14px; padding: 0.55rem 0.8rem;
    }
    /* Message entry: a short rise + fade. Long enough to read as arrival, short
       enough that it never delays the answer the reader asked for. */
    .ltc-enter { animation: ltc-rise 0.32s cubic-bezier(0.32, 0.72, 0, 1) both; }
    .ltc-enter.ltc-settled { animation: none; }
    @keyframes ltc-rise {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: none; }
    }
    .ltc-msg-actions {
      display: flex; gap: 0.25rem; margin-top: 0.1rem;
      opacity: 0; transition: opacity 0.18s ease;
    }
    .ltc-msg:hover .ltc-msg-actions,
    .ltc-msg:focus-within .ltc-msg-actions { opacity: 1; }
    /* Keep it reachable when there is no pointer to hover with. */
    @media (hover: none) { .ltc-msg-actions { opacity: 1; } }
    .ltc-msg-copy {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 28px; height: 28px; padding: 0 0.45rem; border-radius: 8px;
      border: 1px solid transparent; background: transparent; color: #5A6377;
      cursor: pointer;
      font-family: "JetBrains Mono", monospace; font-size: 10px;
      transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }
    .ltc-msg-copy svg { width: 14px; height: 14px; }
    .ltc-msg-copy:hover { color: #E9EDF4; background: rgba(255, 255, 255, 0.07); border-color: var(--line); }
    .ltc-msg-copy.is-done { color: var(--accent); }
    .ltc-msg-copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; opacity: 1; }
    /* The reveal caret. A blinking block, not a spinner: it says "more is
       coming" in the place the next word will appear. */
    .ltc-caret {
      display: inline-block; vertical-align: -2px;
      width: 2px; height: 1.02em; margin-left: 2px; border-radius: 2px;
      background: var(--accent);
      box-shadow: 0 0 7px rgba(200, 250, 75, 0.55);
      animation: ltc-caret-blink 1s steps(1, end) infinite;
    }
    @keyframes ltc-caret-blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    .ltc-msg-tail { white-space: pre-wrap; }
    .ltc-msg-body p { margin: 0 0 0.6rem; }
    .ltc-msg-body p:last-child { margin-bottom: 0; }
    /* Tailwind's CDN preflight resets list-style/margin on ul+ol, so bullets and
       numbers have to be restored explicitly or every list renders as loose
       indented paragraphs. */
    .ltc-msg-body ul { list-style: disc outside; margin: 0 0 0.6rem; padding-left: 1.15rem; }
    .ltc-msg-body ol { list-style: decimal outside; margin: 0 0 0.6rem; padding-left: 1.3rem; }
    .ltc-msg-body li { margin-bottom: 0.25rem; }
    .ltc-msg-body li::marker { color: var(--accent); }
    .ltc-msg-body li > p { margin-bottom: 0.25rem; }
    .ltc-msg-body code:not(pre code) {
      background: rgba(200, 250, 75, 0.1); color: var(--accent);
      padding: 0.1rem 0.35rem; border-radius: 0.3rem; font-size: 0.9em;

      border: 1px solid var(--line); border-radius: 0.6rem;

    .ltc-msg-body table {

      font-size: 0.78rem; line-height: 1.5;
      font-family: "JetBrains Mono", monospace;

    .ltc-msg-body th, .ltc-msg-body td {
      border-bottom: 1px solid var(--line);
      padding: 0.4rem 0.55rem; text-align: left; white-space: nowrap;
    }
    .ltc-msg-body th {
      background: rgba(200, 250, 75, 0.07); color: var(--accent);
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
      font-size: 0.7rem; position: sticky; top: 0;

      color: var(--muted); position: sticky; left: 0; background: var(--surface);

    .ltc-msg-body tbody tr:last-child td { border-bottom: none; }
    .ltc-msg-body strong { color: #fff; }
    /* Mermaid in the chat reuses the article's .mermaid look, but the rail is

    .ltc-msg-body .mermaid {

    }
    .ltc-msg-body .mermaid svg { max-width: 100% !important; width: auto; height: auto; min-width: 0; }
    .ltc-mermaid-error {
      background: #0A0D13; border: 1px dashed rgba(251, 113, 133, 0.35); color: var(--muted);
      border-radius: 0.6rem; padding: 0.6rem 0.7rem; margin: 0.6rem 0;
      font-size: 0.74rem; line-height: 1.5; white-space: pre; overflow-x: auto;
    }
    /* viz-array: an array drawn as cells, with pointer markers and a Map/Set row.
       Cells and pointer slots share ONE grid (row 1 / row 2) so a pointer can

    .viz-array {

      padding: 0.7rem; margin: 0.6rem 0; overflow-x: auto;
    }
    .viz-title {
      font-family: "JetBrains Mono", monospace; font-size: 0.7rem; color: var(--muted);
      margin-bottom: 0.5rem; white-space: nowrap;

      min-width: max-content;
    }
    .viz-cell {

      color: #E9EDF4; font-family: "JetBrains Mono", monospace; font-size: 0.78rem;
      text-align: center; padding: 0.4rem 0.3rem; min-width: 34px;
    }
    .viz-cell.is-active {

      background: rgba(200, 250, 75, 0.1); font-weight: 600;
    }

    .viz-cell.is-swapped { border-color: #8B5CF6; color: #C4B5FD; }
    .viz-cell.is-error { border-color: #FB7185; color: #FB7185; }
    .viz-pointer {
      display: block; text-align: center; font-family: "JetBrains Mono", monospace;
      font-size: 0.62rem; color: var(--accent); letter-spacing: 0.04em;

    .viz-row {
      display: flex; align-items: center; flex-wrap: wrap; gap: 0.3rem;
      margin-top: 0.55rem; font-family: "JetBrains Mono", monospace; font-size: 0.7rem;
    }
    .viz-row-label {
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
      font-size: 0.6rem; margin-right: 0.15rem;
    }
    .viz-pair, .viz-item {
      border: 1px solid var(--line); border-radius: 0.35rem; background: var(--raised);
      padding: 0.15rem 0.4rem; color: #C6CDDB; white-space: nowrap;

    .viz-arrow { color: var(--muted); margin: 0 0.2rem; }
    .ltc-msg-body h1, .ltc-msg-body h2, .ltc-msg-body h3 {

    }
    .ltc-msg-body h1 { font-size: 1rem; }
    .ltc-msg-body h2 { font-size: 0.92rem; }
    .ltc-msg-body h3 { font-size: 0.86rem; color: var(--accent); }
    /* The copy button is emitted by the marked renderer, not post-processed. */
    .chat-code { position: relative; margin: 0.6rem 0; }
    .chat-code pre {
      margin: 0; background: #0A0D13; border: 1px solid var(--line);
      border-radius: 0.7rem; overflow-x: auto;

    }
    .chat-code-copy {

      font-family: "JetBrains Mono", monospace; font-size: 10px; min-height: 26px;
    }
    .chat-code-copy:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
    .ltc-msg-error {
      font-size: 12px; line-height: 1.55; color: #FB7185;
      border: 1px solid rgba(251, 113, 133, 0.3); background: rgba(251, 113, 133, 0.07);
      border-radius: 0.5rem; padding: 0.4rem 0.6rem; margin-top: 0.35rem;
    }
    .ltc-retry {
      align-self: flex-start; margin-top: 0.3rem;
      border: 1px solid rgba(200, 250, 75, 0.35); background: rgba(200, 250, 75, 0.07);
      color: var(--accent); border-radius: 0.5rem; padding: 0.3rem 0.65rem;
      font-family: "JetBrains Mono", monospace; font-size: 11px; min-height: 32px;

    .ltc-typing { display: flex; gap: 5px; padding: 0.15rem 0 0.15rem 0.2rem; }

    .ltc-send, .ltc-stop {
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; flex-shrink: 0; padding: 0;
      border-radius: 11px; border: 1px solid transparent; cursor: pointer;
      transition: background-color 0.16s ease, color 0.16s ease,
                  border-color 0.16s ease, transform 0.16s ease, opacity 0.16s ease;

    .ltc-send:focus-visible, .ltc-stop:focus-visible {

      display: inline-flex; align-items: center; justify-content: center;
      width: 56px; height: 56px; border-radius: 999px;
      background: var(--accent); color: var(--accent-ink);

  <!-- Mobile trigger for the assistant bottom sheet -->
  <button id="ltcFab" class="ltc-fab" type="button" aria-expanded="false" aria-controls="ltcPanel" aria-label="Open the AI study assistant">
    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h8m-8 4h5M21 12a9 9 0 11-3.2-6.9M21 4v5h-5"/></svg>

  <!-- Command palette -->
  <div id="palette" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm opacity-0" role="dialog" aria-modal="true" aria-label="Jump to problem">
    <div class="flex items-start justify-center pt-[12dvh] px-4">
      <div id="paletteCard" class="w-full md:max-w-xl rounded-2xl border border-[rgba(148,163,184,0.2)] bg-[#0D1017] shadow-2xl shadow-black/60 overflow-hidden opacity-0 scale-[0.98]">
        <div class="flex items-center gap-2 px-4 border-b border-[rgba(148,163,184,0.13)]">
          <svg class="h-4 w-4 text-slate-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M21 21l-4.3-4.3M11 19a8 8 0 100-16 8 8 0 000 16z"/></svg>
          <input id="paletteInput" type="text" placeholder="Type a problem, pattern, or topic…" autocomplete="off"
                 class="w-full bg-transparent py-4 text-[15px] placeholder-slate-500 focus:outline-none min-h-[52px]">
          <kbd class="k shrink-0">esc</kbd>
        </div>
        <div id="paletteList" class="max-h-[50dvh] overflow-y-auto p-2" role="listbox"></div>
        <div class="px-4 py-2.5 border-t border-[rgba(148,163,184,0.13)] flex items-center gap-4 text-[11px] text-slate-500 font-mono">
          <span><kbd class="k">↑↓</kbd> navigate</span><span><kbd class="k">↵</kbd> open</span><span><kbd class="k">esc</kbd> close</span>
        </div>

  <script src="curriculum-data.js"></script>

  <script>
    'use strict';
    /* ---------- data index ---------- */
    const DATA = (window.CURRICULUM_DATA || []).filter(c => c && Array.isArray(c.items));
    const byId = new Map();
    const flatOrder = [];
    DATA.forEach(cat => cat.items.forEach(item => {
      byId.set(item.id, { item, category: cat.category });
      if (cat.category !== 'FOUNDATIONS') flatOrder.push(item.id);
    }));

    /* ---------- persistent progress ---------- */
    const LS_KEY = 'lt150-done-v1';
    let doneSet = new Set();
    try { doneSet = new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]')); } catch (e) { doneSet = new Set(); }
    const saveDone = () => { try { localStorage.setItem(LS_KEY, JSON.stringify([...doneSet])); } catch (e) {} };

    /* ---------- state ---------- */
    let activeFilter = 'ALL';
    let searchQuery = '';
    let currentItemId = null;
    let palIndex = 0;
    let palResults = [];

    /* ---------- element refs ---------- */
    const $ = (id) => document.getElementById(id);
    const nav = $('curriculumNav'), contentArea = $('articleContent'), articleHead = $('articleHead'),
      crumbRow = $('crumbRow'), prevNext = $('prevNext'), tocNav = $('tocNav'),
      searchInput = $('searchInput'), sidebar = $('sidebar'), sideOverlay = $('sideOverlay'),
      palette = $('palette'), paletteCard = $('paletteCard'), paletteInput = $('paletteInput'),
      paletteList = $('paletteList'), scroller = $('contentContainer'), progressBar = $('progressBar');

    const DIFF_STYLE = {
      Easy: 'background:rgba(52,211,153,.12);color:#34D399;border:1px solid rgba(52,211,153,.3)',
      Medium: 'background:rgba(251,191,36,.12);color:#FBBF24;border:1px solid rgba(251,191,36,.3)',
      Hard: 'background:rgba(251,113,133,.12);color:#FB7185;border:1px solid rgba(251,113,133,.3)',
      Primer: 'background:rgba(200,250,75,.1);color:#C8FA4B;border:1px solid rgba(200,250,75,.3)',
    };
    const badge = (d) => `<span class="nav-badge text-[10px] px-1.5 py-0.5 rounded font-semibold shrink-0 font-mono" style="${DIFF_STYLE[d] || DIFF_STYLE.Primer}">${d}</span>`;
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    /* ---------- sidebar ---------- */
    function paintFilterPills() {
      document.querySelectorAll('.filter-btn').forEach(b => {
        const on = b.dataset.diff === activeFilter;
        b.style.cssText = on
          ? 'background:#C8FA4B;color:#101303;'
          : 'background:rgba(255,255,255,.04);color:#8B94A7;';
      });
    }

    function renderProgress() {
      const total = flatOrder.length || 1;
      const done = flatOrder.filter(id => doneSet.has(id)).length;
      const pct = Math.round((done / total) * 100);
      $('ringFg').style.strokeDashoffset = String(163.36 * (1 - done / total));
      $('ringPct').textContent = pct + '%';
      $('ringSub').textContent = done + ' / ' + flatOrder.length + ' done';
      $('overallChip').innerHTML = '<span class="inline-block h-1.5 w-1.5 rounded-full" style="background:#C8FA4B"></span>' + pct + '% complete';
    }

    function renderNav() {
      nav.innerHTML = '';
      if (!DATA.length) {
        nav.innerHTML = '<p class="text-sm text-slate-500 px-2">No curriculum data found. Run <span class="font-mono">npm run build</span>.</p>';
        return;
      }
      DATA.forEach(cat => {
        const items = cat.items.filter(item => {
          const diffOk = activeFilter === 'ALL' ? true : item.difficulty === activeFilter;
          if (!diffOk) return false;
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          return item.title.toLowerCase().includes(q) || item.content.toLowerCase().includes(q);
        });
        if (!items.length) return;
        const isFound = cat.category === 'FOUNDATIONS';
        const doneCount = isFound ? 0 : items.filter(i => doneSet.has(i.id)).length;
        const wrap = document.createElement('div');
        const head = document.createElement('div');
        head.className = 'px-2 pt-1';
        head.innerHTML = '<div class="flex items-baseline justify-between gap-2">' +
          '<span class="nav-group-label text-[11px] font-bold text-slate-400 uppercase tracking-widest font-display">' + esc(cat.category) + '</span>' +
          (isFound
            ? '<span class="nav-group-count text-[10px] font-mono text-slate-600">' + items.length + '</span>'
            : '<span class="nav-group-count text-[10px] font-mono text-slate-500">' + doneCount + '/' + items.length + '</span>') +
          '</div>' +
          (isFound ? '' : '<div class="mod-bar mt-1.5"><span style="width:' + Math.round((doneCount / items.length) * 100) + '%"></span></div>');
        wrap.appendChild(head);
        const list = document.createElement('div');
        list.className = 'space-y-0.5 mt-1';
        items.forEach(item => {
          const done = doneSet.has(item.id);
          const active = item.id === currentItemId;
          const btn = document.createElement('button');
          btn.className = 'nav-item w-full text-left px-3 py-2.5 rounded-lg text-[13px] flex items-center gap-2 border min-h-[44px] md:min-h-0';
          btn.style.cssText = active
            ? 'background:rgba(200,250,75,.1);color:#fff;border-color:rgba(200,250,75,.35);'
            : 'color:#C2C9D8;border-color:transparent;';
          btn.onmouseenter = () => { if (!active) btn.style.background = 'rgba(255,255,255,.05)'; };
          btn.onmouseleave = () => { if (!active) btn.style.background = 'transparent'; };
          btn.innerHTML =
            '<span class="shrink-0 w-4 text-center font-mono text-[11px]" style="color:' + (done ? '#C8FA4B' : '#3A4358') + '">' + (done ? '✓' : '·') + '</span>' +
            '<span class="nav-title truncate flex-1 ' + (done && !active ? 'line-through opacity-60' : '') + '">' + esc(item.title) + '</span>' +
            badge(item.difficulty);
          btn.title = item.title;
          btn.onclick = () => openArticle(item.id);
          list.appendChild(btn);
        });
        wrap.appendChild(list);
        nav.appendChild(wrap);
      });
      renderProgress();
    }

    /* ---------- article ---------- */
    function renderHead(entry) {
      const { item, category } = entry;
      const done = doneSet.has(item.id);
      crumbRow.classList.remove('hidden');
      crumbRow.classList.add('flex');
      crumbRow.innerHTML = '<span>' + esc(category) + '</span><span>/</span><span class="text-slate-300">' + esc((item.pattern || '').split('/')[0].trim() || item.difficulty) + '</span>';
      articleHead.innerHTML =
        '<div class="flex flex-wrap items-center gap-2 mb-3">' + badge(item.difficulty) +
        '<span class="text-xs text-slate-500 font-mono">' + esc(item.pattern || '') + '</span></div>' +
        '<div class="flex flex-wrap items-center gap-3">' +
        (item.leetcodeLink
          ? '<a href="' + esc(item.leetcodeLink) + '" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl font-semibold text-sm min-h-[44px] transition-transform active:scale-95" style="background:#C8FA4B;color:#101303;">Solve on LeetCode' +
            '<svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg></a>'
          : '') +
        '<button id="doneToggle" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold border min-h-[44px] transition-colors" style="' +
            (done ? 'border-color:rgba(200,250,75,.4);color:#C8FA4B;background:rgba(200,250,75,.07);' : 'border-color:rgba(148,163,184,.25);color:#8B94A7;') + '">' +
          '<span>' + (done ? '✓ Completed' : '○ Mark complete') + '</span></button>' +
        '</div>';
      $('doneToggle').onclick = () => {
        if (doneSet.has(item.id)) doneSet.delete(item.id); else doneSet.add(item.id);
        saveDone();
        renderHead(entry);
        renderNav();
      };
    }

    function renderPrevNext() {
      const idx = flatOrder.indexOf(currentItemId);
      const at = (i) => (i >= 0 && i < flatOrder.length ? byId.get(flatOrder[i]).item : null);
      const cell = (it, label, align) => {
        if (!it) return '<span></span>';
        return '<button data-nav="' + it.id + '" class="text-left rounded-xl border border-[rgba(148,163,184,0.15)] bg-white/[0.02] hover:bg-white/[0.06] active:bg-white/10 px-4 py-3 min-h-[56px] transition-colors ' + align + '">' +
          '<span class="block text-[10px] font-mono uppercase tracking-widest text-slate-500">' + label + '</span>' +
          '<span class="block text-sm font-medium text-slate-200 truncate mt-0.5">' + esc(it.title) + '</span></button>';
      };
      prevNext.innerHTML = cell(at(idx - 1), '← Prev', '') + cell(at(idx + 1), 'Next →', 'text-right');
      prevNext.querySelectorAll('[data-nav]').forEach(b => { b.onclick = () => openArticle(b.dataset.nav); });
    }

    let tocObserver = null;

    function renderTOC() {
      tocNav.innerHTML = '';
      if (tocObserver) { tocObserver.disconnect(); tocObserver = null; }
      const heads = [...contentArea.querySelectorAll('h2')];
      const sections = [];

      const setOpen = (sec, open) => {
        sec.dataset.collapsed = open ? 'false' : 'true';
        sec.querySelector('.toc-toggle').setAttribute('aria-expanded', String(open));
      };

      heads.forEach((h, i) => {
        if (!h.id) h.id = 'sec-' + i;
        const sec = document.createElement('div');
        sec.className = 'toc-sec';
        sec.dataset.sec = h.id;
        sec.dataset.collapsed = 'true';

        const row = document.createElement('div');
        row.className = 'toc-row';

        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        a.title = h.textContent;
        a.className = 'toc-link block text-[13px] pl-3 py-1 truncate min-w-0 flex-1';
        a.onclick = (e) => {
          e.preventDefault();
          h.scrollIntoView({ behavior: 'smooth', block: 'start' });
          history.replaceState(null, '', '#' + h.id);
        };

        const sub = document.createElement('div');
        sub.className = 'toc-sub';
        sub.id = 'toc-sub-' + h.id;
        // Single inner wrapper: the 0fr->1fr row trick only collapses a
        // container that holds exactly one child.
        const subInner = document.createElement('div');
        subInner.className = 'toc-sub-inner';
        sub.appendChild(subInner);

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'toc-toggle shrink-0 text-slate-600 hover:text-slate-300 px-1';
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-controls', sub.id);
        toggle.setAttribute('aria-label', 'Subsections of ' + h.textContent);
        toggle.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
        toggle.onclick = () => {
          const open = sec.dataset.collapsed === 'true';
          setOpen(sec, open);
          // A section the reader opened stays visible when the one-liner moves on.
          if (open) sec.dataset.userOpen = 'true'; else delete sec.dataset.userOpen;
        };

        row.append(a, toggle);
        sec.append(row, sub);
        tocNav.appendChild(sec);

        let n = h.nextElementSibling;
        while (n && n.tagName !== 'H2') {
          if (n.tagName === 'H3') {
            if (!n.id) n.id = h.id + '-s' + subInner.children.length;
            const s = document.createElement('a');
            s.href = '#' + n.id;
            s.textContent = n.textContent;
            s.title = n.textContent;
            s.className = 'toc-sub-link truncate';
            s.dataset.for = n.id;
            s.onclick = (e) => {
              e.preventDefault();
              n.scrollIntoView({ behavior: 'smooth', block: 'start' });
              history.replaceState(null, '', '#' + n.id);
            };
            subInner.appendChild(s);
          }
          n = n.nextElementSibling;
        }

        sections.push({ sec, h, subs: [...subInner.children] });
      });

      if (!heads.length) {
        tocNav.innerHTML = '<span class="text-xs text-slate-600 pl-3">No sections</span>';
        return;
      }

      const markCurrentChild = (id) => {
        const owner = sections.find((s) => s.subs.some((a) => a.dataset.for === id));
        sections.forEach((s) => s.subs.forEach((a) =>
          a.classList.toggle('is-current', a.dataset.for === id)));
        // Jumping straight to a subsection skips its h2 entirely, so the
        // owning section is promoted here or the one-liner goes stale.
        if (owner) markActive(owner.h.id);
      };

      const markActive = (id) => {
        const target = sections.find((s) => s.h.id === id) || sections[0];
        // Sections are built in article order, so a section the reader opened
        // earlier would otherwise sit above the one they are reading now. Move
        // the current one to the front; the opened ones keep their order below.
        if (tocNav.firstElementChild !== target.sec) tocNav.prepend(target.sec);
        sections.forEach((s) => {
          s.sec.classList.toggle('is-active', s === target);
          // The one-liner stays collapsed; only a section the reader opened
          // by hand survives the one-liner moving to another section.
          if (s.sec.dataset.userOpen !== 'true') setOpen(s.sec, false);
        });
      };

      // A heading counts as "in view" inside the top band of the scroller. The
      // sticky header is a sibling of the scroller, not an overlay on it, so
      // the top edge needs no offset: a heading jumped to `start` sits at y=0
      // and must still count.
      tocObserver = new IntersectionObserver(
        (entries) => {
          // Several headings can share the band at once, so take the topmost
          // of each kind rather than whichever the observer happened to batch
          // last. Sections first, then children, so the most specific wins.
          const top = (tag) => entries
            .filter((e) => e.isIntersecting && e.target.tagName === tag)
            .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
          const h2 = top('H2'), h3 = top('H3');
          if (h2) markActive(h2.target.id);
          if (h3) markCurrentChild(h3.target.id);
        },
        { root: contentContainer, rootMargin: '0px 0px -70% 0px', threshold: 0 },
      );
      heads.forEach((h) => tocObserver.observe(h));
      contentArea.querySelectorAll('h3').forEach((h) => tocObserver.observe(h));
      markActive(heads[0].id);
    }

    function enhanceCodeBlocks() {
      // Wrap tables for safe mobile horizontal scroll (global fix)
      contentArea.querySelectorAll('table').forEach(tbl => {
        if (tbl.parentElement && tbl.parentElement.classList.contains('table-scroll')) return;
        const wrap = document.createElement('div');
        wrap.className = 'table-scroll';
        tbl.replaceWith(wrap);
        wrap.appendChild(tbl);
      });
      // Tag raw primer file-paths so they show a tooltip instead of looking broken
      // Linkify: bare http(s) code pills (e.g. LeetCode Link) open in a new tab;
      // primer file-paths open the primer inside the portal when it exists.
      contentArea.querySelectorAll('code').forEach(c => {
        if (c.closest('pre')) return;
        const t = c.textContent.trim();
        if (/^https?:\/\//.test(t)) {
          const a = document.createElement('a');
          a.href = t;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.title = 'Open in new tab: ' + t;
          c.replaceWith(a);
          a.appendChild(c);
          return;
        }
        if (/\.md$/.test(t)) {
          const id = t.replace(/\.md$/, '').replace(/\//g, '_');
          if (byId.has(id)) {
            c.classList.add('primer-link');
            c.title = 'Open primer in portal: ' + t;
            c.onclick = () => openArticle(id);
          } else {
            c.classList.add('primer-path');
            c.title = t;
          }
        }
      });
      contentArea.querySelectorAll('pre code').forEach(block => {
        if (block.classList.contains('language-mermaid')) {
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = block.textContent;
          block.parentElement.replaceWith(div);
          return;
        }
        const pre = block.parentElement;
        const wrap = document.createElement('div');
        wrap.className = 'code-wrap relative';
        pre.replaceWith(wrap);
        wrap.appendChild(pre);
        const btn = document.createElement('button');
        btn.className = 'copy-btn absolute top-2 right-2 text-[11px] font-mono px-2.5 py-1.5 rounded-md bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300';
        btn.textContent = 'Copy';
        btn.onclick = async () => {
          const ok = await copyText(block.textContent);
          btn.textContent = ok ? 'Copied ✓' : 'Copy failed';
          setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
        };
        wrap.appendChild(btn);
        // Touch views: double-tap the code box to copy (no button there).
        let lastTap = 0, lastX = 0, lastY = 0, multiTouch = false;
        wrap.addEventListener('touchstart', (e) => {
          if (e.touches.length > 1) multiTouch = true;
        }, { passive: true });
        wrap.addEventListener('touchend', async (e) => {
          if (e.touches.length > 0) return; // still touching (pinch/scroll)
          if (multiTouch) { multiTouch = false; lastTap = 0; return; }
          const t = e.changedTouches[0];
          const now = Date.now();
          const moved = Math.hypot(t.clientX - lastX, t.clientY - lastY);
          if (lastTap > 0 && now - lastTap < 350 && moved < 30) {
            lastTap = 0;
            flashCopied(wrap, await copyText(block.textContent));
          } else {
            lastTap = now; lastX = t.clientX; lastY = t.clientY;
          }
        }, { passive: true });
      });
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          ta.remove();
          return ok;
        } catch (e2) { return false; }
      }
    }

    // Transient "Copied ✓" pill for touch views (no persistent button to update).
    function flashCopied(wrap, ok) {
      wrap.querySelectorAll('.copy-flash').forEach(n => n.remove());
      const pill = document.createElement('span');
      pill.className = 'copy-flash absolute top-2 right-2 text-[11px] font-mono px-2.5 py-1.5 rounded-md bg-white/5 border border-white/10 text-slate-300';
      pill.textContent = ok ? 'Copied ✓' : 'Copy failed';
      wrap.appendChild(pill);
      setTimeout(() => pill.remove(), 1500);
    }

    (function initNavCollapse() {

      if (!el || !btn) return;
      const KEY = 'lt150-nav-stage';
      const LABELS = ['Collapse the navigation',
                      'Widen the navigation to a text rail',

      let stage = 0;

        el.dataset.stage = String(stage);
        btn.setAttribute('aria-label', LABELS[stage]);
        btn.title = LABELS[stage];

        });
        if (persist) { try { localStorage.setItem(KEY, String(stage)); } catch (e) {} }

    /* ---------- rail resize (item C) ---------- */
    (function initRailResize() {
      const el = $('ltRail'), handle = $('ltRailResizer');
      if (!el || !handle) return;
      const MIN = 320, MAX = 720, DEF = 380, KEY = 'lt150-rail-w';
      const clamp = (v) => Math.min(MAX, Math.max(MIN, Math.round(v)));
      const apply = (w, persist) => {
        w = clamp(w);
        document.documentElement.style.setProperty('--lt-rail-w', w + 'px');
        handle.setAttribute('aria-valuenow', String(w));
        if (persist) { try { localStorage.setItem(KEY, String(w)); } catch (e) {} }
        return w;
      };
      let saved = DEF;
      try { const v = parseInt(localStorage.getItem(KEY), 10); if (v) saved = v; } catch (e) {}
      apply(saved, false);

      const widthFromX = (x) => window.innerWidth - x;
      let dragging = false, startX = 0, moved = false;
      const onMove = (e) => {
        if (!dragging || Math.abs(e.clientX - startX) < 3) return;
        moved = true;
        apply(widthFromX(e.clientX), true);
      };
      const onUp = (e) => {
        dragging = false;
        handle.classList.remove('is-dragging');
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        if (moved) apply(widthFromX(e.clientX), true);
      };
      // Document-level listeners, not setPointerCapture, which suppresses the
      // compatibility click and dblclick events. The width only changes after
      // real movement: a plain click must not nudge the rail, or the handle
      // slides out from under the second click of a double-click.
      handle.addEventListener('pointerdown', (e) => {
        dragging = true; moved = false; startX = e.clientX;
        handle.classList.add('is-dragging');
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
        document.addEventListener('pointercancel', onUp);
      });
      handle.addEventListener('dblclick', () => { apply(DEF, true); });
      handle.addEventListener('keydown', (e) => {
        const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--lt-rail-w'), 10) || DEF;
        if (e.key === 'ArrowLeft') { apply(cur + 32, true); e.preventDefault(); }
        if (e.key === 'ArrowRight') { apply(cur - 32, true); e.preventDefault(); }
      });
    })();
    $('brandHome').onclick = (e) => {
      e.preventDefault();
      openHome();
    };

    /* ---------- filters ---------- */
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => { activeFilter = btn.dataset.diff; paintFilterPills(); renderNav(); };
    });
    searchInput.oninput = (e) => { searchQuery = e.target.value; renderNav(); };

    /* ---------- command palette ---------- */
    function fuzzyMatch(hay, needle) {
      hay = hay.toLowerCase();
      needle = needle.toLowerCase().replace(/\s+/g, '');
      let hi = 0;
      for (const ch of needle) {
        hi = hay.indexOf(ch, hi);
        if (hi === -1) return false;
        hi++;
      }
      return true;
    }
    function openPalette() {
      palette.classList.remove('hidden');
      requestAnimationFrame(() => {
        palette.classList.remove('opacity-0');
        paletteCard.classList.remove('opacity-0', 'scale-[0.98]');
      });
      paletteInput.value = '';
      updatePalette('');
      setTimeout(() => paletteInput.focus(), 30);
    }
    function closePalette() {
      palette.classList.add('opacity-0');
      paletteCard.classList.add('opacity-0', 'scale-[0.98]');
      setTimeout(() => palette.classList.add('hidden'), 150);
      paletteInput.blur();
    }
    function updatePalette(q) {
      const query = q.trim();
      palResults = flatOrder
        .map(id => byId.get(id))
        .filter(e => !query || fuzzyMatch(e.item.title + ' ' + (e.item.pattern || '') + ' ' + e.category, query))
        .slice(0, 12);
      palIndex = 0;
      paletteList.innerHTML = palResults.length ? '' : '<p class="text-sm text-slate-500 px-3 py-6 text-center">No matches. Try a pattern name like “sliding window”.</p>';
      palResults.forEach((e, i) => {
        const done = doneSet.has(e.item.id);
        const div = document.createElement('div');
        div.className = 'pal-item flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer';
        div.setAttribute('role', 'option');
        div.setAttribute('aria-selected', i === palIndex ? 'true' : 'false');
        div.innerHTML =
          '<span class="font-mono text-[11px] w-4 text-center shrink-0" style="color:' + (done ? '#C8FA4B' : '#3A4358') + '">' + (done ? '✓' : '·') + '</span>' +
          '<span class="flex-1 min-w-0"><span class="block text-sm text-slate-200 truncate">' + esc(e.item.title) + '</span>' +
          '<span class="block text-[11px] text-slate-500 font-mono truncate">' + esc(e.category) + '</span></span>' +
          badge(e.item.difficulty);
        div.onclick = () => { closePalette(); openArticle(e.item.id); };
        div.onmousemove = () => { palIndex = i; paintPalSelection(); };
        paletteList.appendChild(div);
      });
    }
    function paintPalSelection() {
      paletteList.querySelectorAll('.pal-item').forEach((el, i) => el.setAttribute('aria-selected', i === palIndex ? 'true' : 'false'));
    }
    $('paletteBtn').onclick = openPalette;
    paletteInput.oninput = (e) => updatePalette(e.target.value);
    paletteInput.onkeydown = (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); palIndex = Math.min(palIndex + 1, palResults.length - 1); paintPalSelection(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); palIndex = Math.max(palIndex - 1, 0); paintPalSelection(); }
      else if (e.key === 'Enter' && palResults[palIndex]) { closePalette(); openArticle(palResults[palIndex].item.id); }
      else if (e.key === 'Escape') closePalette();
    };
    palette.addEventListener('click', (e) => { if (e.target === palette.firstElementChild || e.target === palette) closePalette(); });
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); palette.classList.contains('hidden') ? openPalette() : closePalette(); }
      else if (e.key === 'Escape') { if (!palette.classList.contains('hidden')) closePalette(); else closeSidebar(); }
    });

    /* ---------- reading progress ---------- */
    function updateProgressBar() {
      const max = scroller.scrollHeight - scroller.clientHeight;
      const pct = max > 0 ? (scroller.scrollTop / max) * 100 : 0;
      progressBar.style.width = pct + '%';
    }
    scroller.addEventListener('scroll', updateProgressBar, { passive: true });

    /* ---------- scroll-spy for TOC ---------- */
    const spy = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          tocNav.querySelectorAll('.toc-link').forEach(a => {
            a.classList.toggle('active', a.getAttribute('href') === '#' + en.target.id);
          });
        }
      });
    }, { root: scroller, rootMargin: '-20% 0px -70% 0px' });
    const origRenderTOC = renderTOC;
    renderTOC = function () {
      spy.disconnect();
      origRenderTOC();
      contentArea.querySelectorAll('h2[id]').forEach(h => spy.observe(h));
    };

    /* ---------- in-article cross-links (#<article-id>) ---------- */
    // Guide pages link to each other via #bundle-id anchors. Open those as
    // articles; leave #sec-N TOC anchors to default smooth-scroll behavior.
    contentArea.addEventListener('click', (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const id = a.getAttribute('href').slice(1);
      if (id && byId.has(id)) { e.preventDefault(); openArticle(id); }
    });

    /* ---------- init ---------- */
    paintFilterPills();
    renderNav();
    refreshAuth();
    const startId = location.hash ? location.hash.slice(1) : null;
    if (startId && byId.has(startId)) openArticle(startId);
    else openHome();
    checkLoginError();
    updateProgressBar();
  </script>
  <script src="chat-widget.js"></script>
</body>
</html>
