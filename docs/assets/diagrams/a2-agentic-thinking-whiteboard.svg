<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Comic Sans MS, Segoe UI, sans-serif">
<rect x="0" y="0" width="1000" height="560" rx="18" fill="#f0fdf4" stroke="#1f2937" stroke-width="3" stroke-dasharray="10 6"/>
<text x="30" y="40" font-size="24" font-weight="bold" fill="#1f2937">Whiteboard: One Goal → Router → Specialists → Tools</text>
<rect x="380" y="60" width="240" height="70" rx="35" fill="#1f2937"/>
<text x="400" y="90" font-size="16" fill="#fff" font-weight="bold">User goal</text>
<text x="400" y="112" font-size="13" fill="#fde68a">“Refund + swap my order”</text>
<rect x="380" y="155" width="240" height="80" rx="12" fill="#fff" stroke="#1f2937" stroke-width="3"/>
<text x="395" y="182" font-size="16" font-weight="bold">Router / Triage</text>
<text x="395" y="205" font-size="13">cheap model, classifies,</text>
<text x="395" y="222" font-size="13">hands off, bounded hops</text>
<line x1="500" y1="130" x2="500" y2="155" stroke="#1f2937" stroke-width="3"/>
<rect x="60" y="260" width="260" height="110" rx="12" fill="#fff" stroke="#1f2937" stroke-width="3"/>
<text x="75" y="287" font-size="15" font-weight="bold">Order specialist</text>
<text x="75" y="310" font-size="13">tools: getOrder, refund</text>
<text x="75" y="330" font-size="13">ReAct: think→act→observe</text>
<text x="75" y="350" font-size="13">max 6 steps!</text>
<rect x="370" y="260" width="260" height="110" rx="12" fill="#fff" stroke="#1f2937" stroke-width="3"/>
<text x="385" y="287" font-size="15" font-weight="bold">Docs specialist (RAG)</text>
<text x="385" y="310" font-size="13">tools: policySearch</text>
<text x="385" y="330" font-size="13">cites [Doc: returns]</text>
<text x="385" y="350" font-size="13">says IDK if missing</text>
<rect x="680" y="260" width="260" height="110" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="3" stroke-dasharray="8 5"/>
<text x="695" y="287" font-size="15" font-weight="bold">Critic / Verifier</text>
<text x="695" y="310" font-size="13">scores first answer</text>
<text x="695" y="330" font-size="13">worth it if wrong = $$$</text>
<line x1="430" y1="235" x2="180" y2="260" stroke="#1f2937" stroke-width="3"/>
<line x1="500" y1="235" x2="500" y2="260" stroke="#1f2937" stroke-width="3"/>
<line x1="570" y1="235" x2="820" y2="260" stroke="#1f2937" stroke-width="3" stroke-dasharray="8 5"/>
<rect x="60" y="400" width="880" height="120" rx="12" fill="#e0f2fe" stroke="#1f2937" stroke-width="3"/>
<text x="80" y="428" font-size="15" font-weight="bold">Shared rails (every prod agent needs these)</text>
<text x="80" y="452" font-size="13">Memory: short in-context + long in vector store (retriever, not stuffing) • Guardrails: input/output filters, least-privilege tools, HITL on refunds</text>
<text x="80" y="474" font-size="13">Observability: trace per run (spans), evals in CI, alert on drift • Cost: router picks model tier, cache, per-task budget</text>
<text x="80" y="496" font-size="13" fill="#b91c1c" font-weight="bold">Senior rule: if path is known → workflow, not agent. Agents earn cost only when next step depends on runtime discovery.</text>
</svg>
