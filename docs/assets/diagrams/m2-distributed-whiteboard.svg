<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Comic Sans MS, Segoe UI, sans-serif">
<rect x="0" y="0" width="1000" height="540" rx="18" fill="#f0fdf4" stroke="#1f2937" stroke-width="3" stroke-dasharray="10 6"/>
<text x="30" y="40" font-size="24" font-weight="bold" fill="#1f2937">Whiteboard: Microservices Talk via Redis + Kafka on K8s</text>
<rect x="30" y="60" width="180" height="80" rx="12" fill="#fff" stroke="#1f2937" stroke-width="3"/>
<text x="45" y="88" font-size="14" font-weight="bold">Order svc</text>
<text x="45" y="108" font-size="12">Node, own DB</text>
<text x="45" y="126" font-size="12">sync REST/gRPC</text>
<rect x="240" y="60" width="180" height="80" rx="12" fill="#fff" stroke="#1f2937" stroke-width="3"/>
<text x="252" y="88" font-size="14" font-weight="bold">Redis cache</text>
<text x="252" y="108" font-size="12">SET/GET, TTL</text>
<text x="252" y="126" font-size="12">hit 95%+, LRU</text>
<rect x="450" y="60" width="220" height="80" rx="12" fill="#fff" stroke="#1f2937" stroke-width="3"/>
<text x="462" y="88" font-size="14" font-weight="bold">Kafka log</text>
<text x="462" y="108" font-size="12">topics→partitions</text>
<text x="462" y="126" font-size="12">events, saga, CQRS</text>
<rect x="700" y="60" width="260" height="80" rx="12" fill="#e0f2fe" stroke="#1f2937" stroke-width="3"/>
<text x="712" y="88" font-size="14" font-weight="bold">K8s: pods + svc</text>
<text x="712" y="108" font-size="12">StatefulSet Redis, PVC</text>
<text x="712" y="126" font-size="12">HPA, ConfigMap/Secret</text>
<line x1="210" y1="100" x2="240" y2="100" stroke="#1f2937" stroke-width="3"/>
<line x1="420" y1="100" x2="450" y2="100" stroke="#1f2937" stroke-width="3"/>
<line x1="670" y1="100" x2="700" y2="100" stroke="#1f2937" stroke-width="3"/>
<rect x="30" y="165" width="930" height="115" rx="12" fill="#fff" stroke="#1f2937" stroke-width="3"/>
<text x="45" y="193" font-size="14" font-weight="bold">Talk rules: sync for real-time (REST/gRPC), async for decoupled (Kafka/RabbitMQ). DB per service + saga + eventual + CDC.</text>
<text x="45" y="215" font-size="12">Discovery: K8s DNS / Eureka / Consul. Gateway: Kong/NGINX/AWS (route, auth, limit, cache). Observe: Prometheus/Grafana/ELK.</text>
<text x="45" y="237" font-size="12">Resilience: retry/backoff, breaker, bulkhead, timeout. Testing pyramid: many unit, few UI. Containers: Docker per svc, K8s orchestrates.</text>
<text x="45" y="259" font-size="12">Kafka nutshell: producers → topics (partitions, offsets) → consumers/groups; event streaming = store + process + replay.</text>
<rect x="30" y="300" width="450" height="200" rx="12" fill="#fefce8" stroke="#1f2937" stroke-width="3"/>
<text x="45" y="328" font-size="14" font-weight="bold">Redis JS (ioredis) cache-aside</text>
<text x="45" y="350" font-size="12">1 try GET → hit? return</text>
<text x="45" y="370" font-size="12">2 miss → DB → SETEX TTL</text>
<text x="45" y="390" font-size="12">3 invalidate on write</text>
<text x="45" y="410" font-size="12">maxmemory 2gb, allkeys-lru</text>
<text x="45" y="430" font-size="12">Sentinel HA, Cluster scale</text>
<text x="45" y="450" font-size="12">secure: requirepass + TLS + rename</text>
<rect x="510" y="300" width="450" height="200" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
<text x="525" y="328" font-size="14" font-weight="bold" fill="#14532d">Kafka JS (kafkajs) pub/sub</text>
<text x="525" y="350" font-size="12" fill="#14532d">producer.send(topic, messages)</text>
<text x="525" y="370" font-size="12" fill="#14532d">consumer group processes each</text>
<text x="525" y="390" font-size="12" fill="#14532d">partition once → scale by parts</text>
<text x="525" y="410" font-size="12" fill="#14532d">offset = replay position</text>
<text x="525" y="430" font-size="12" fill="#14532d">SAGA: events drive steps,</text>
<text x="525" y="450" font-size="12" fill="#14532d">compensate on fail, no 2PC.</text>
</svg>
